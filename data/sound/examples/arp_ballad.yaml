# Rhapsody "A Window in Rain" | 12/8 ballad, 4/4 theatre and rock, 12/8 coda | A minor, C major, Eb/C minor, E minor, A minor to A major | 8580 | 1 SID
# Techniques: A four-movement rhapsody: 12/8 triplet ballad, cut to staccato 4/4 theatre, a fast E-minor rock movement, then a slower 12/8 coda. The carried E5 becomes the theatre's first chord; the three-note head of the ballad becomes block chords, then a fourfold rock diminution. One SID: harp bass and six-tone left-hand arpeggio, counterline, ornaments and filter ownership on v1.
# Learn: Hear one E-C / B-A falling-lilt motif change scale, rhythm and role instead of repeating a verse. The shock is the held E5 cut into the Eb theatre at bar 33; after the hard-rock B7, the coda returns the lilt in A major. Signature: the motif's return over a bare harp in the last 10 bars.
# Accepted lint: LEVEL-NOOP (7 sustain-zero percussion triggers); HR-GAP (1 deliberate recitative rest at bar 60).
sidwave: 1.3
title: "A Window in Rain"
tempo: 125.31
meter: "12/8"
mode: "PAL"
sids:
  - {id: "sid1", address: "$D400", model: "8580", filter: {owner: "v1", route: [1]}}
instruments:
  # ---------------- ballad ----------------
  # Harp: a +12 pluck frame, a slow width drift that runs across notes, and a low-pass that closes on every note.
  harp:
    waveform: "pulse"
    adsr: [0, 8, 5, 7]
    hard_restart: {frames: 0}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "pulse"}]
    pulsetable: {reset: false, loop: 1, steps: [{set: 500}, {add: 6, frames: 120}, {add: -6, frames: 120}]}
    filtertable: [{cutoff: "1.7kHz", resonance: 9, type: "lowpass"}, {add: -14, frames: 12}]
  # Harp bass note: a triangle click an octave up, then a wide pulse that narrows under a slower low-pass.
  hb:
    waveform: "pulse"
    adsr: [0, 9, 6, 7]
    hard_restart: {test: true}
    wavetable: [{wave: "tri", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 1400}, {add: -30, frames: 20}]
    filtertable: [{cutoff: "1.2kHz", resonance: 10, type: "lowpass"}, {add: -10, frames: 16}]
  # Music-box bell for the first statement of the motif: ring-modulated triangle, source an octave up.
  bell:
    waveform: "tri"
    adsr: [0, 10, 0, 9]
    wavetable: [{wave: "tri", ring: true, note: "+12"}, {wave: "tri", ring: true}]
    source_note: "+12"
  # Ballad lead: one saw frame, a narrow pulse that opens fast and then breathes; vibrato grows after 20 frames.
  voice:
    waveform: "pulse"
    adsr: [2, 8, 10, 6]
    portamento: 5
    wavetable: [{wave: "saw"}, {wave: "pulse"}]
    pulsetable: &voicepw {loop: 2, steps: [{set: 320}, {add: 80, frames: 14}, {add: -9, frames: 45}, {add: 9, frames: 45}]}
    vibrato: &voicevib {depth: 0.32, rate: 5.4, delay: 20, fade: 30}
  vgr:
    waveform: "pulse"
    adsr: [2, 8, 10, 6]
    wavetable: [{wave: "saw", note: "+1"}, {note: "+1", frames: 2}, {wave: "pulse"}]
    pulsetable: *voicepw
    vibrato: *voicevib
  vmo:
    waveform: "pulse"
    adsr: [2, 8, 10, 6]
    wavetable: [{wave: "saw"}, {wave: "pulse", frames: 2}, {note: "+2", frames: 3}, {wave: "pulse"}]
    pulsetable: *voicepw
    vibrato: *voicevib
  # Second melody: a two-frame pulse breath into a triangle with a slow, shallow vibrato.
  flute:
    waveform: "tri"
    pulse_width: 1200
    adsr: [4, 6, 11, 7]
    wavetable: [{wave: "pulse", frames: 2}, {wave: "tri"}]
    vibrato: {depth: 0.22, rate: 4.8, delay: 26, fade: 40}
  # Chorus and solo lead: a noise breath, a wide pulse that narrows, deeper and faster vibrato.
  sing:
    waveform: "pulse"
    adsr: [1, 6, 12, 7]
    portamento: 4
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: &singpw {loop: 2, steps: [{set: 2000}, {add: -45, frames: 18}, {add: 7, frames: 60}, {add: -7, frames: 60}]}
    vibrato: &singvib {depth: 0.45, rate: 6.1, delay: 14, fade: 22}
  sgr:
    waveform: "pulse"
    adsr: [1, 6, 12, 7]
    wavetable: [{wave: "noise", note: "+1"}, {wave: "pulse", note: "+1", frames: 2}, {wave: "pulse"}]
    pulsetable: *singpw
    vibrato: *singvib
  smo:
    waveform: "pulse"
    adsr: [1, 6, 12, 7]
    wavetable: [{wave: "noise"}, {wave: "pulse", frames: 2}, {note: "+2", frames: 3}, {wave: "pulse"}]
    pulsetable: *singpw
    vibrato: *singvib
  # Shimmer chords: one frame per tone after a saw frame two octaves up, top tone first; the played note is the
  # lowest tone, and the name gives the voicing (6 = first inversion, 64 = second inversion).
  sh_maj: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+12"}, {note: "+7"}, {note: "+4"}, {note: "+0"}], pulsetable: &shpw {reset: false, loop: 1, steps: [{set: 900}, {add: 12, frames: 90}, {add: -12, frames: 90}]}, loop: 1}
  sh_min: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+12"}, {note: "+7"}, {note: "+3"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  sh_6: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+12"}, {note: "+8"}, {note: "+3"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  sh_6m: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+12"}, {note: "+9"}, {note: "+4"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  sh_64: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+12"}, {note: "+9"}, {note: "+5"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  sh_43: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+8"}, {note: "+5"}, {note: "+3"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  sh_7sus: {waveform: "pulse", adsr: [0, 9, 7, 6], wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+10"}, {note: "+7"}, {note: "+5"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  sh_add9: {waveform: "pulse", adsr: [1, 10, 8, 10], wavetable: [{wave: "saw", note: "+26"}, {wave: "pulse", note: "+14"}, {note: "+7"}, {note: "+4"}, {note: "+0"}], pulsetable: *shpw, loop: 1}
  # Solo chords: two frames per tone (the warbling chord), from chord tokens; the instrument gives envelope and width.
  warble:
    waveform: "pulse"
    adsr: [0, 8, 8, 5]
    pulsetable: {reset: false, loop: 1, steps: [{set: 1500}, {add: -10, frames: 70}, {add: 10, frames: 70}]}
  # ---------------- theatre ----------------
  # Low voice: a high noise consonant, then a 40 % pulse through a band-pass that opens like a vowel.
  lowv:
    waveform: "pulse"
    adsr: [0, 6, 10, 4]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse"}]
    pulsetable: [{set: 1640}, {add: -6, frames: 40}]
    filtertable: [{cutoff: "450Hz", resonance: 12, type: "bandpass"}, {add: 5, frames: 22}, {add: -2, frames: 40}]
    vibrato: {depth: 0.3, rate: 5.8, delay: 16, fade: 16}
  lows:
    waveform: "pulse"
    adsr: [0, 8, 6, 3]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse"}]
    pulsetable: [{set: 1640}]
    filtertable: [{cutoff: "1.4kHz", resonance: 6, type: "lowpass"}, {add: -12, frames: 8}]
  # High voice: noise consonant, 15 % pulse, a quick operatic vibrato.
  highv:
    waveform: "pulse"
    adsr: [0, 6, 11, 4]
    portamento: 3
    wavetable: [{wave: "noise", note: "+24"}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 614}, {add: 8, frames: 30}, {add: -8, frames: 30}]}
    vibrato: {depth: 0.4, rate: 7.2, delay: 9, fade: 9}
  highs:
    waveform: "pulse"
    adsr: [0, 8, 6, 3]
    wavetable: [{wave: "noise", note: "+24"}, {wave: "pulse"}]
    pulsetable: [{set: 614}, {add: 20, frames: 10}]
  # Harpsichord: a saw octave frame, then a narrow pulse that dies fast.
  pluck:
    waveform: "pulse"
    adsr: [0, 8, 2, 4]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 360}, {add: 30, frames: 8}]
  # ---------------- rock ----------------
  kick:
    waveform: "pulse"
    adsr: [0, 8, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "C7"}, {wave: "pulse", note: "B3", slide_to: "E2", frames: 3}, {wave: "tri", note: "E2", slide_to: "B1", frames: 3}, {gate: false}]
    filtertable: [{cutoff: "2.2kHz", resonance: 4, type: "lowpass"}]
  snare:
    waveform: "pulse"
    adsr: [0, 7, 0, 0]
    wavetable: [{wave: "tri", note: "A3"}, {wave: "noise", note: "D6", frames: 2}, {wave: "pulse", note: "E3"}, {wave: "noise", note: "B5", frames: 3}, {gate: false}]
    filtertable: [{cutoff: "2kHz", resonance: 6, type: "bandpass"}]
  snare_low:
    waveform: "pulse"
    adsr: [0, 8, 0, 0]
    wavetable: [{wave: "tri", note: "F3"}, {wave: "noise", note: "A5", frames: 2}, {wave: "pulse", note: "C3"}, {wave: "noise", note: "F5", frames: 3}, {gate: false}]
    filtertable: [{cutoff: "300Hz", resonance: 3, type: "highpass"}]
  ghost:
    waveform: "noise"
    adsr: [0, 4, 0, 0]
    wavetable: [{wave: "noise", note: "C6", frames: 2}, {gate: false}]
    filtertable: [{cutoff: "1.2kHz", resonance: 2, type: "highpass"}]
  hat:
    waveform: "noise"
    adsr: [0, 2, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "A7"}, {gate: false}]
  hat_open:
    waveform: "noise"
    adsr: [0, 7, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "A7"}, {wave: "noise", note: "F7"}]
  crash:
    waveform: "noise"
    adsr: [0, 11, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "D7", frames: 2}, {wave: "noise", note: "G6"}]
  # Chug: a saw octave frame, then a pulse narrowing from 63 %, palm-muted by a resonant low-pass that shuts in 6 frames.
  chug:
    waveform: "pulse"
    adsr: [0, 6, 9, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 2600}, {add: -100, frames: 12}]
    filtertable: [{cutoff: "1.5kHz", resonance: 12, type: "lowpass"}, {add: -30, frames: 6}]
  chug_open:
    waveform: "saw"
    adsr: [0, 9, 8, 4]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw"}]
    filtertable: [{cutoff: "2.4kHz", resonance: 13, type: "lowpass"}, {add: -8, frames: 30}]
  # Power chord: a noise frame, then root, fifth and octave one frame each on a saw.
  pc:
    waveform: "saw"
    adsr: [0, 8, 9, 3]
    wavetable: [{wave: "noise", note: "+24"}, {wave: "saw", note: "+12"}, {note: "+7"}, {note: "+0"}]
    loop: 1
  # Rock lead: an octave pulse click, a fast width sweep, deep vibrato.
  rlead:
    waveform: "pulse"
    adsr: [0, 5, 12, 4]
    portamento: 2
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "pulse"}]
    pulsetable: &rockpw {loop: 2, steps: [{set: 400}, {add: 150, frames: 10}, {add: -40, frames: 18}, {add: 40, frames: 18}]}
    vibrato: &rockvib {depth: 0.5, rate: 6.6, delay: 10, fade: 12}
  # Bends need a wavetable without pitch steps: the click is a noise frame.
  rbend:
    waveform: "pulse"
    adsr: [0, 5, 12, 6]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: *rockpw
    vibrato: {depth: 0.55, rate: 6.6, delay: 45, fade: 30}
  rharm:
    waveform: "saw"
    adsr: [0, 5, 11, 3]
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw"}]
    vibrato: {depth: 0.3, rate: 6.6, delay: 12, fade: 12}
  # ---------------- coda ----------------
  deep:
    waveform: "tri"
    adsr: [0, 0, 15, 11]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "tri"}]
    filtertable: [{cutoff: "900Hz", resonance: 6, type: "lowpass"}]
kit:
  k: "kick"
  s: "snare"
  z: "snare_low"
  j: "ghost"
  h: "hat"
  o: "hat_open"
  x: "crash"
