# Drum and bass | 176.91 BPM | G minor, breakdown in Bb major | 1 SID
# Techniques: Speed 2 (100 player calls per second; speed 4 would need 6937 cycles per call against
#   4139) with call-timed table steps; a break kit of eleven wavetable drums (two kicks, snare at three pitches,
#   ghost, closed and open hat, crash, a roll snare and a pitched-down snare whose tone follows the played note);
#   a Reese from two saws detuned -7 and +7 cents on voices 2 and 3 through a looping filter table that keeps
#   running across notes; four-tone chord arps at 100 Hz (one call per tone) in the intro and builds, two-frame
#   warbling arps in the breakdown; a pulse lead whose 0.5-semitone vibrato fades in after 16 frames, with
#   grace, mordent, octave flick, scoops, turns and a fall-off; a saw lead with a faster, shallower fading
#   vibrato for the fragments in the second drop; triangle glass bells that foreshadow the theme.
# Rhythm grid: 176.91 BPM at speed 2 gives 8.5 calls per sixteenth (80/90 ms alternating); this is an intentional
# 53% long-short shuffle, not a straight 16th grid.
# Learn: Three voices change jobs by section: voice 1 is bells, then drums; voice 2 is sub, band-pass riser, Reese
#   oscillator and owner of the filter throughout; voice 3 is chord arps, the second Reese oscillator, the lead
#   and, in the second drop, both at once (lead fragments in the gaps of the riff).
# Form (bar = 1.357 s):
#   Intro      1-16   0:00-0:22  Gm9 Ebmaj7 Cm9 D7#9 as 100 Hz arps over a G pedal; glass bells sketch the
#                                theme (bars 1-8); hats and a walking sub from bar 9; the low-pass opens
#   Build     17-24   0:22-0:33  dominant pedal D through a rising band-pass; snare roll from eighths to 32nds
#                                with rising pitch; the arps double their harmonic rhythm in bar 23
#   Drop      25-56   0:33-1:16  Reese riff (G1 with a falling fourth, stabs Bb1 G1, G2 on the "and" of 4;
#                                answer Eb1 to F1); two break patterns alternate every two bars, an edit every 8th bar;
#                                bars 35-36 the riff drops a tone to F (answer Db1 to Eb1), bars 45-48 it moves to
#                                C (iv), answer Ab1 to Bb1
#   Breakdown 57-72   1:16-1:38  half time, the lead theme over the triangle sub (drums enter in bar 61); phrases
#                                of 4, 4, 3 (bars 65-67) and 5 bars; modulation to Bb major (bars 65-70) via Abmaj7
#   Build     73-79   1:38-1:47  chromatic bass Eb D Db C under the turn in sequence, then D7#9 retriggers
#   Surprise     80   1:47       two beats of silence, then a pitched-down snare triplet (C4 A3 F3)
#   Drop      81-112  1:48-2:32  new riff with the Phrygian Ab; lead fragments in its gaps (climax 89-96, the
#                                highest note D6 in bar 93); bars 97-100 on C; double-time break in bars 105-112
#   Outro    113-120  2:32-2:43  arps return (Ebmaj7 D7#9 Cm9 D7#9), cadence D7#9 to Gm9 on a crash
# Motif (breakdown lead): D5 (h.) | Eb5 D5 C5 (s s s, slurred turn) | Bb4 (anticipated by a 16th) | leap of a
#   major seventh to A5 (scooped, vibrato 0.5) | G5 (mordent): scale degrees 5 b6 5 4 3 2 1.
# Signature: bar 80, two beats of silence and the falling snare triplet before the second drop.
# Harmony: Gm9 Ebmaj7 Cm9 D7#9 (D pedal in the build), Am7b5 D7b9 (secondary ii-V), Bbmaj7 Abmaj7 (borrowed bVII
#   of Bb) Cm9 F7 Bbmaj7 in the breakdown, Ebmaj7 D7#9 Dbmaj7#11 Cm9 over the chromatic bass, Ab in the riff.
# Accepted lint: ARP-FAST for the 100 Hz chord arps (one call per tone, the fused chord the style asks for) and the
#   half-frame clicks that open the drums, arps and the saw lead; TEMPO-GRID because 176.91 BPM gives 8.5 calls per
#   sixteenth at speed 2, so sixteenths alternate between 8 and 9 calls (5 ms).
sidwave: 1.3
title: Switchyard
tempo: 176.91
mode: PAL
speed: 2
accent: 2
sids:
  - { id: sid1, address: "$D400", model: "8580", filter: { owner: v2, route: [2, 3] } }
kit:
  k: kick
  j: kick2
  s: snare
  t: snare2
  n: rim
  q: ghost
  h: hat
  o: ohat
  z: crash
instruments:
  kick:
    waveform: tri
    pulse_width: 1000
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: C6, calls: 1 }, { wave: pulse, note: G3, slide_to: G1, frames: 2 }, { wave: tri, note: G1 }]
  kick2:
    waveform: tri
    adsr: [0, 6, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: F6, calls: 1 }, { wave: tri, note: D3, slide_to: A1, frames: 2 }, { note: A1 }]
  snare:
    waveform: noise
    pulse_width: 2048
    adsr: [0, 8, 0, 0]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: tri, note: D4, calls: 1 }, { wave: noise, note: C6, calls: 1 }, { wave: pulse, note: A3, calls: 2 }, { wave: noise, note: A5 }]
  snare2:
    waveform: noise
    pulse_width: 2048
    adsr: [0, 9, 0, 0]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: tri, note: A3, calls: 1 }, { wave: noise, note: G5, calls: 1 }, { wave: pulse, note: E3, calls: 2 }, { wave: noise, note: E5 }]
  rim:
    waveform: noise
    adsr: [0, 5, 0, 2]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: tri, note: A4, calls: 1 }, { wave: noise, note: E6, frames: 2 }, { gate: false }]
  ghost:
    waveform: noise
    adsr: [0, 4, 0, 2]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: noise, note: G5, frames: 2 }]
  hat:
    waveform: noise
    adsr: [0, 3, 0, 3]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: noise, note: A#7, calls: 2 }, { gate: false }]
  ohat:
    waveform: noise
    adsr: [0, 7, 0, 6]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: noise, note: G7, frames: 3 }, { note: F7 }]
  crash:
    waveform: noise
    adsr: [0, 11, 0, 11]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: noise, note: F7, frames: 4 }, { note: C7 }]
  # Roll snare: its tone follows the played note, so a rising sequence raises the roll.
  sr:
    waveform: noise
    adsr: [0, 6, 0, 3]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: tri, note: "+12", calls: 1 }, { wave: noise, note: "+36" }]
  # Pitched-down snare for the triplet before the second drop.
  sd:
    waveform: noise
    adsr: [0, 9, 0, 8]
    wavetable: [{ wave: tri, note: "+12", slide_to: "+0", frames: 2 }, { wave: noise, note: "+30", frames: 2 }, { wave: tri, note: "+0", slide_to: "-12", frames: 5 }]
  # Glass bell: an octave click, then a decaying triangle.
  gl:
    waveform: tri
    pulse_width: 2048
    adsr: [0, 10, 0, 10]
    wavetable: [{ wave: pulse, note: "+12", calls: 2 }, { wave: tri }]
  sub:
    waveform: tri
    pulse_width: 1024
    adsr: [0, 4, 13, 6]
    hard_restart: { test: true }
    wavetable: [{ wave: pulse, note: "+12", calls: 2 }, { wave: tri }]
    filtertable: { reset: false, loop: 1, steps: [{ cutoff: 1.4kHz, resonance: 9, type: lowpass }, { add: 2, frames: 90 }, { add: -2, frames: 90 }] }
  # The sub in the build: the same triangle, but the filter it owns is a band-pass, so the arps become a riser.
  sbp:
    waveform: tri
    pulse_width: 1024
    adsr: [0, 4, 13, 6]
    hard_restart: { test: true }
    wavetable: [{ wave: pulse, note: "+12", calls: 2 }, { wave: tri }]
    filtertable: { reset: false, loop: 1, steps: [{ cutoff: 700Hz, resonance: 12, type: bandpass }, { add: 3, frames: 60 }, { add: -3, frames: 60 }] }
  # Reese, oscillator 1: its looping filter table keeps running across notes and owns the filter for both saws.
  reese:
    waveform: saw
    pulse_width: 2048
    adsr: [0, 3, 11, 3]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: pulse, note: "+12", calls: 1 }, { wave: saw }]
    filtertable: { reset: false, loop: 1, steps: [{ cutoff: 1.5kHz, resonance: 12, type: lowpass }, { add: 6, frames: 36 }, { add: -6, frames: 36 }] }
  reese3:
    waveform: saw
    pulse_width: 2048
    adsr: [0, 3, 10, 3]
    hard_restart: { frames: 0 }
    wavetable: [{ wave: pulse, note: "+12", calls: 1 }, { wave: saw }]
  # 100 Hz chord arps: two calls per tone, top tone first so the root lands last.
  a1:
    waveform: pulse
    adsr: [3, 8, 9, 7]
    loop: 1
    wavetable: [{ wave: noise, note: "+36", calls: 1 }, { wave: pulse, note: "+11", calls: 1 }, { note: "+7", calls: 1 }, { note: "+4", calls: 1 }, { note: "+0", calls: 1 }]
    pulsetable: { reset: false, loop: 1, steps: [{ set: 0.25 }, { add: 6, frames: 80 }, { add: -6, frames: 80 }] }
  a2:
    waveform: pulse
    adsr: [3, 8, 9, 7]
    loop: 1
    wavetable: [{ wave: noise, note: "+36", calls: 1 }, { wave: pulse, note: "+16", calls: 1 }, { note: "+11", calls: 1 }, { note: "+7", calls: 1 }, { note: "+0", calls: 1 }]
    pulsetable: { reset: false, loop: 1, steps: [{ set: 0.3 }, { add: 5, frames: 90 }, { add: -5, frames: 90 }] }
  a3:
    waveform: pulse
    adsr: [3, 8, 9, 7]
    loop: 1
    wavetable: [{ wave: noise, note: "+36", calls: 1 }, { wave: pulse, note: "+15", calls: 1 }, { note: "+10", calls: 1 }, { note: "+4", calls: 1 }, { note: "+0", calls: 1 }]
    pulsetable: { reset: false, loop: 1, steps: [{ set: 0.2 }, { add: 7, frames: 70 }, { add: -7, frames: 70 }] }
  a4:
    waveform: pulse
    adsr: [3, 8, 9, 7]
    loop: 1
    wavetable: [{ wave: noise, note: "+36", calls: 1 }, { wave: pulse, note: "+14", calls: 1 }, { note: "+10", calls: 1 }, { note: "+3", calls: 1 }, { note: "+0", calls: 1 }]
    pulsetable: { reset: false, loop: 1, steps: [{ set: 0.35 }, { add: -5, frames: 80 }, { add: 5, frames: 80 }] }
  # Two frames per tone: the warbling chord that answers the lead in the breakdown.
  w1:
    waveform: pulse
    adsr: [0, 8, 6, 6]
    loop: 1
    wavetable: [{ wave: noise, note: "+36", calls: 1 }, { wave: pulse, note: "+11", frames: 2 }, { note: "+7", frames: 2 }, { note: "+4", frames: 2 }, { note: "+0", frames: 2 }]
    pulsetable: [{ set: 0.4 }, { add: -20, frames: 30 }]
  w2:
    waveform: pulse
    adsr: [0, 8, 6, 6]
    loop: 1
    wavetable: [{ wave: noise, note: "+36", calls: 1 }, { wave: pulse, note: "+10", frames: 2 }, { note: "+6", frames: 2 }, { note: "+3", frames: 2 }, { note: "+0", frames: 2 }]
    pulsetable: [{ set: 0.4 }, { add: -20, frames: 30 }]
  # Lead: octave click, a narrow pulse that opens fast and breathes slowly, vibrato that fades in after 16 frames.
  ld:
    waveform: pulse
    adsr: [2, 6, 11, 6]
    wavetable: [{ note: "+12", frames: 1 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 0.08 }, { add: 60, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
    vibrato: { depth: 0.5, rate: 6, delay: 16, fade: 30 }
  ldg:
    waveform: pulse
    adsr: [2, 6, 11, 6]
    wavetable: [{ note: "-1", frames: 1 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 0.08 }, { add: 60, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
    vibrato: { depth: 0.5, rate: 6, delay: 16, fade: 30 }
  ldm:
    waveform: pulse
    adsr: [2, 6, 11, 6]
    wavetable: [{ frames: 2 }, { note: "+2", frames: 2 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 0.08 }, { add: 60, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
    vibrato: { depth: 0.5, rate: 6, delay: 16, fade: 30 }
  ldf:
    waveform: pulse
    adsr: [1, 6, 11, 6]
    wavetable: [{ note: "+12", frames: 3 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 0.08 }, { add: 60, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
    vibrato: { depth: 0.5, rate: 6, delay: 16, fade: 30 }
  # Scooped and bent lead notes: the transient is a saw frame, not a pitch step, so slides and bends stay free.
  lds:
    waveform: pulse
    adsr: [2, 6, 11, 6]
    wavetable: [{ wave: saw, frames: 1 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 0.08 }, { add: 60, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
    vibrato: { depth: 0.5, rate: 6, delay: 16, fade: 30 }
  l2s:
    waveform: saw
    adsr: [1, 6, 12, 5]
    wavetable: [{ wave: noise, calls: 1 }, { wave: saw }]
    vibrato: { depth: 0.3, rate: 7, delay: 8, fade: 14 }
  # Second lead colour: a saw with a noise click and a faster, shallower vibrato.
  l2:
    waveform: saw
    adsr: [1, 6, 12, 5]
    wavetable: [{ wave: noise, note: "+24", calls: 1 }, { wave: saw }]
    vibrato: { depth: 0.3, rate: 7, delay: 8, fade: 14 }
