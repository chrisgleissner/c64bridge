# Clockwork waltz | 150.37 BPM, 3/4 | D minor, trio Bb major, return changed | 1 SID
# Techniques: Contrasting waltz, trio and coda movements; 3/4 becomes 6/8 at the same eighth pulse; dyad wavetables, slurred soprano, cello counterline, hemiola cadences, phrase ornaments, and a short ritardando into a released cadence.
# Learn: One rising three-note idea changes harmony and role as the melody, cello answer and trio countermelody; the return adds the cello to the opening dance. The A3-to-trio boundary is the sudden new major-mode movement; the coda recalls the opening rhythm over a descending bass.
sidwave: 1.3
title: "Clockwork Waltz"
tempo: 150.37
meter: "3/4"
mode: "PAL"
sids:
  - {id: "sid1", address: "$D400", model: "8580"}
instruments:
  # Soprano: pulse with a slow width drift and vibrato that only starts on held notes; slurs keep the gate on.
  soprano:
    waveform: "pulse"
    adsr: [3, 6, 10, 7]
    pulsetable: {reset: false, loop: 1, steps: [{set: 0.45}, {add: -10, frames: 40}, {add: 10, frames: 40}]}
    vibrato: {depth: 0.12, rate: 5, delay: 20}
  soprano_end:
    waveform: "pulse"
    adsr: [3, 6, 10, 11]
    pulsetable: {reset: false, loop: 1, steps: [{set: 0.45}, {add: -10, frames: 40}, {add: 10, frames: 40}]}
    vibrato: {depth: 0.12, rate: 5, delay: 20}
  # Alto: two-note chords played as a 3-frame dyad (lower note, upper note) on the waltz's second and third beats.
  m3: {waveform: "pulse", adsr: [1, 6, 6, 5], wavetable: [{note: "+0", frames: 3}, {note: "+3", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  M3: {waveform: "pulse", adsr: [1, 6, 6, 5], wavetable: [{note: "+0", frames: 3}, {note: "+4", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  p4: {waveform: "pulse", adsr: [1, 6, 6, 5], wavetable: [{note: "+0", frames: 3}, {note: "+5", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  tt: {waveform: "pulse", adsr: [1, 6, 6, 5], wavetable: [{note: "+0", frames: 3}, {note: "+6", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  M6: {waveform: "pulse", adsr: [1, 6, 6, 5], wavetable: [{note: "+0", frames: 3}, {note: "+9", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  M3end: {waveform: "pulse", adsr: [1, 6, 7, 11], wavetable: [{note: "+0", frames: 3}, {note: "+4", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  m3end: {waveform: "pulse", adsr: [1, 6, 7, 11], wavetable: [{note: "+0", frames: 3}, {note: "+3", frames: 3}], pulsetable: [{set: 0.25}], loop: 0}
  cello: {waveform: "tri", adsr: [1, 8, 10, 8]}
  cello_end: {waveform: "tri", adsr: [1, 8, 10, 11]}
voices:
  - id: 1
    name: "Soprano"
    role: "lead"
    instrument: "soprano"
    patterns:
      # Theme: rising three-note figure, leap, stepwise fall; half cadence after a hemiola in bars 7-8.
      a1: {groove: "D5 ~ ~ (E5 F5) ~ | A5 ~ ~ ~ (G5 F5) | G5 ~ ~ (F5 E5) ~ | C#5 ~ ~ ~ (D5 E5) | F5 ~ ~ (G5 A5) ~ | D6 ~ ~ ~ (C6 A5) | Bb5 ~ ~ ~ G5 ~ | ~ ~ E5 ~ ~ ~", length: 0.5, bars: 8}
      a2: {groove: "D5 ~ ~ (E5 F5) ~ | A5 ~ ~ (Bb5 A5 G5) | G5 ~ ~ (A5 Bb5) ~ | C6 ~ ~ ~ (Bb5 G5) | A5 ~ ~ (G5 F5) ~ | D6 ~ ~ ~ Bb5 ~ | ~ ~ E5 ~ C#5 ~ | D5 ~ ~ ~ - -", length: 0.5, bars: 8}
      # The same phrases with turns and running eighths.
      a1v: {groove: "D5 ~ (E5 F5 E5 D5) | A5 ~ ~ ~ (G5 F5) | G5 ~ (A5 G5 F5 E5) | C#5 ~ ~ ~ (D5 E5) | F5 ~ (G5 A5 Bb5 C6) | D6 ~ ~ ~ (C6 A5) | Bb5 ~ ~ ~ G5 ~ | ~ ~ E5 ~ ~ ~", length: 0.5, bars: 8}
      a2v: {groove: "D5 ~ (E5 F5 G5 F5) | A5 ~ ~ (Bb5 A5 G5) | G5 ~ (A5 Bb5 C6 Bb5) | C6 ~ ~ ~ (Bb5 G5) | A5 ~ ~ (G5 F5) ~ | D6 ~ ~ ~ Bb5 ~ | ~ ~ E5 ~ C#5 ~ | D5 ~ ~ ~ - -", length: 0.5, bars: 8}
      # B in F major: dotted figures, appoggiatura on C7, retransition on an A pedal.
      b1: {groove: "C6 ~ ~ Bb5 A5 ~ | G5 ~ ~ ~ Bb5 ~ | A5 ~ ~ G5 F5 ~ | F5 ~ ~ ~ D6 ~ | D6 ~ ~ C6 Bb5 ~ | (A5 G5) ~ ~ (E5 G5) | (F5 A5) C6 ~ Bb5 ~ | G5 ~ ~ ~ - -", length: 0.5, bars: 8}
      b2: {groove: "C6 ~ ~ Bb5 A5 ~ | G5 ~ ~ ~ E5 ~ | F5 ~ ~ E5 D5 ~ | D5 ~ ~ ~ Bb5 ~ | Bb5 ~ ~ A5 G5 ~ | (G5 F5) ~ ~ (E5 C#5) | E5 ~ ~ ~ (F5 E5) | (D5 C#5) ~ ~ ~ ~", length: 0.5, bars: 8}
      # Trio in Bb: long notes over a moving cello.
      t1: {groove: "F5 ~ ~ ~ ~ ~ | Eb5 ~ ~ ~ (D5 C5) | D5 ~ ~ ~ ~ ~ | G5 ~ ~ ~ (F5 Eb5) | Eb5 ~ ~ (F5 G5) ~ | A5 ~ ~ ~ (C6 A5) | Bb5 ~ ~ ~ ~ ~ | (A5 G5) ~ (F5 Eb5) ~", length: 0.5, bars: 8}
      t2: {groove: "D6 ~ ~ ~ (C6 Bb5) | G5 ~ ~ ~ ~ ~ | Bb5 ~ ~ ~ (Ab5 G5) | F5 ~ ~ ~ ~ ~ | G5 ~ ~ (F5 Eb5) ~ | Eb5 ~ ~ ~ (D5 C5) | D5 ~ ~ ~ ~ ~ | ~ ~ ~ ~ - -", length: 0.5, bars: 8}
      t3: {groove: "Bb5 ~ ~ ~ (A5 G5) | G5 ~ ~ ~ (F5 Eb5) | Eb5 ~ ~ ~ (D5 C5) | C#5 ~ ~ ~ (D5 E5) | F5 ~ ~ ~ (E5 D5) | F5 ~ ~ ~ (G5 A5) | Bb5 ~ ~ ~ ~ ~ | (A5 G5) ~ (E5 C#5) ~", length: 0.5, bars: 8}
      coda: {groove: "A5 ~ ~ ~ (F5 D5) | G5 ~ ~ ~ Bb5 ~ | A5 ~ ~ ~ G5 ~ | E5 ~ ~ ~ C#5 ~ | D5@soprano_end ~ ~ ~ ~ ~ | ~ ~ ~ ~ ~ ~", length: 0.5, bars: 6}
  - id: 2
    name: "Alto (waltz chords)"
    role: "pad"
    patterns:
      k1: {groove: "- F4@M3 F4@M3 | - F4@M3 F4@M3 | - G4@m3 G4@m3 | - G4@tt G4@tt | - F4@M3 F4@M3 | - F4@p4 F4@p4 | G4@m3 ~ E4@m3 | ~ C#4@m3 ~", length: 1, bars: 8}
      k2: {groove: "- F4@M3 F4@M3 | - F4@M3 F4@M3 | - G4@m3 G4@m3 | - E4@tt E4@tt | - F4@M3 F4@M3 | F4@p4 ~ G4@m3 | ~ G4@tt ~ | - F4@M3 F4@M3", length: 1, bars: 8}
      kb1: {groove: "- A4@m3 A4@m3 | - G4@m3 G4@m3 | - A4@m3 A4@m3 | - F4@p4 F4@p4 | - F4@M6 F4@M6 | - E4@tt E4@tt | - A4@m3 Bb4@M3 | - E4@m3 E4@m3", length: 1, bars: 8}
      kb2: {groove: "- A4@m3 A4@m3 | - E4@m3 E4@m3 | - F4@M3 F4@M3 | - F4@p4 F4@p4 | - G4@m3 G4@m3 | - G4@tt G4@tt | - E4@m3 E4@m3 | - G4@tt G4@tt", length: 1, bars: 8}
      kt1: {groove: "- F4@p4 F4@p4 | - C4@m3 C4@m3 | - D4@m3 D4@m3 | - Eb4@M3 Eb4@M3 | - Eb4@M3 Eb4@M3 | - Eb4@tt Eb4@tt | - D4@m3 D4@m3 | - Eb4@tt Eb4@tt", length: 1, bars: 8}
      kt2: {groove: "- D4@m3 D4@m3 | - Bb3@M3 Bb3@M3 | - Eb4@M3 Eb4@M3 | - D4@m3 D4@m3 | - Eb4@M3 Eb4@M3 | - Eb4@tt Eb4@tt | - D4@m3 D4@m3 | - D4@m3 D4@m3", length: 1, bars: 8}
      kt3: {groove: "- Bb3@M3 Bb3@M3 | - Bb3@p4 Bb3@p4 | - C4@m3 C4@m3 | - C#4@m3 C#4@m3 | - D4@m3 D4@m3 | - D4@m3 D4@m3 | - E4@m3 E4@m3 | - C#4@m3 C#4@m3", length: 1, bars: 8}
      kc: {groove: "- F4@M3 F4@M3 | - G4@m3 G4@m3 | - G4@tt G4@tt | - G4@tt E4@m3 | F4@M3end ~ ~ | ~ ~ ~", length: 1, bars: 6}
  - id: 3
    name: "Cello"
    role: "bass"
    instrument: "cello"
    patterns:
      # Oom-pah bass: one note on the downbeat, hemiola in half notes.
      w1: {groove: "D2 ~ - | A2 ~ - | G2 ~ - | A2 ~ - | D2 ~ - | Bb2 ~ - | G2 ~ Bb2 | ~ A2 ~", length: 1, bars: 8}
      w2: {groove: "D2 ~ - | F2 ~ - | G2 ~ - | C2 ~ - | F2 ~ - | Bb2 ~ G2 | ~ A2 ~ | D2 ~ -", length: 1, bars: 8}
      # Countermelody: moves against the soprano's held notes, still anchors every downbeat.
      c1: {groove: "D3 C3 Bb2 | A2 F2 D2 | G2 A2 Bb2 | A2 G2 E2 | D2 F2 A2 | Bb2 A2 G2 | G2 ~ Bb2 | ~ A2 ~", length: 1, bars: 8}
      c2: {groove: "D3 C3 Bb2 | F2 E2 D2 | G2 Bb2 D3 | C2 E2 G2 | F2 A2 C3 | Bb2 ~ G2 | ~ A2 ~ | D2 - -", length: 1, bars: 8}
      cb1: {groove: "F2 A2 C3 | E2 G2 C3 | F2 C3 A2 | Bb2 D3 F2 | G2 Bb2 D3 | C3 Bb2 G2 | A2 F2 Bb2 | C3 G2 C2", length: 1, bars: 8}
      cb2: {groove: "F2 A2 C3 | C#3 E2 A2 | D3 A2 F2 | Bb2 F2 D2 | G2 Bb2 D3 | A2 C#3 E3 | A2 - A2 | A2 ~ ~", length: 1, bars: 8}
      # Recap answer: reopen the original rising D-minor figure, then let the soprano's a1/a2 theme answer.
      c3: {groove: "D2 F2 A2 | D3 C3 Bb2 | A2 C3 E3 | A2 G2 F2 | D2 F2 A2 | Bb2 D3 F3 | G2 Bb2 D3 | A2 ~ ~", length: 1, bars: 8}
      ct1: {groove: "Bb2 C3 D3 | A2 ~ ~ | D3 C3 Bb2 | Eb3 ~ ~ | C3 Bb2 G2 | F2 ~ A2 | Bb2 D3 F3 | F3 ~ F2", length: 1, bars: 8}
      ct2: {groove: "Bb2 F2 D2 | G2 F2 Eb2 | Eb2 G2 Bb2 | D3 ~ F2 | C3 Bb2 A2 | F2 G2 A2 | Bb2 F2 D2 | Bb2 ~ ~", length: 1, bars: 8}
      ct3: {groove: "G2 Bb2 D3 | Eb2 G2 Bb2 | C3 ~ ~ | A2 G2 E2 | D2 F2 A2 | Bb2 A2 G2 | E2 G2 Bb2 | A2 ~ ~", length: 1, bars: 8}
      cc: {groove: "D2 A2 D3 | Bb2 ~ G2 | A2 ~ ~ | A2 E2 C#3 | D2@cello_end ~ ~ | ~ ~ ~", length: 1, bars: 6}
sections:
  A: {bars: 16, meter: "3/4", tempo: 150.37, level: "p", layers: {v1: "a1 a2", v2: "k1 k2", v3: "w1 w2"}}
  A2: {bars: 16, meter: "3/4", tempo: 150.37, level: "mp", layers: {v1: "a1v a2v", v2: "k1 k2", v3: "c1 c2"}}
  B: {bars: 16, meter: "3/4", tempo: 125.31, level: "f", layers: {v1: "b1 b2", v2: "kb1 kb2", v3: "cb1 cb2"}}
  A3: {bars: 16, meter: "3/4", tempo: 150.37, level: "mf", layers: {v1: "a1 a2", v2: "k1 k2", v3: "c3 c2"}}
  trio: {bars: 24, meter: "6/8", tempo: 150.37, level: {from: "pp", to: "mp"}, layers: {v1: "t1 t2 t3", v2: "kt1 kt2 kt3", v3: "ct1 ct2 ct3"}}
  recap: {bars: 16, meter: "3/4", tempo: 150.37, level: {from: "f", to: "ff"}, layers: {v1: "a1v a2v", v2: "k1 k2", v3: "w1 c2"}}
  # Ritardando over the coda, then the D-minor chord is held and released.
  coda: {bars: 6, meter: "3/4", tempo: {to: 112}, level: "ff", layers: {v1: "coda", v2: "kc", v3: "cc"}}
timeline: ["A", "A2", "B", "A3", "trio", "recap", "coda"]
accent: 2
end: {hold_beats: 0, release: true}
