# Electro funk with samples | 107.41 BPM | F minor (last chorus G minor) | 2 SIDs
# Techniques: Swing 0.58; SID 2 carries only CIA2 volume-register digis at 4 kHz (synthesised kick, snare, clap, two toms, seven chord hits at fixed pitches, and five formant syllables), so the sample writes to $D418 never touch the pitched voices on SID 1; the digi voice is monophonic, so kick, snare and syllables are composed as one line. On SID 1 a saw slap bass with ghost and pop variants owns the resonant low-pass and switches to a band-pass solo voice in the break; voice 2 interleaves noise hats with clav chord chops (10 % pulse opening in 5 frames, one frame per tone) and two-frame warble triads in the last chorus; voice 3 is a glide lead (portamento 4, scoops, staccato, fall-offs, lower mordents) that hands the chorus to a saw+pulse horn and the last chorus to a breathy whistle.
# Learn: Lead and samples trade phrases: the lead's call (C gliding up to Eb, two staccato Fs, a fall back to C) leaves six sixteenths, and the vocal syllables answer in them. Because the digi voice is monophonic, every syllable replaces a drum hit, which is why the answers sit where the snare is not needed.
# Form (bar = 2.23 s): intro 1-4 (0:00), syllables and clap alone, SID hats from bar 3 | groove 5-12 (0:09) | verse 13-28 (0:27), lead call and vocal answer, harmonic rhythm doubling from bar 21 | pre 29-32 (1:03), rising glide sequence over a snare roll | chorus 33-40 (1:12), Db Eb Fm Ab/Eb with sampled chord hits | break 41-48 (1:29), band-pass bass solo and tom fills, half a bar of silence at bar 44, bar 48 the samples alone | verse 49-56 (1:47), last bar D7#9 | chorus in G minor 57-64 (2:05), warble triads | outro 65-72 (2:23), the vocal riff alone from bar 69, final hit, 2:41.
# Harmony: verse Fm9 | Bb13 | Dbmaj7 | C7#9 (twice), then Abmaj7 | Gm7b5 C7#9 | Fm9 Eb/G | Abmaj7 Bbm7 | Dbmaj7 | Gm7b5 C7 | Fm9 Fm9/Eb | Db7 C7#9; pre Bbm9 | C7sus4 | Bbm9/Ab | Ab13 with the bass walking Ab A Bb B C into Db; chorus Db | Eb | Fm | Ab/Eb | Db | Eb | Fm Eb/G | Abmaj7 C7#9; the last chorus is a whole tone higher, prepared by D7#9.
# Motif: lead 5 (e) gliding up to b7 (q), 1 1 (s s, staccato), falling back to 5 (e), six sixteenths of rest (C5 /Eb5 F5 F5 C5); bass F1 (e), rest, F2 ghost, Ab1 A1 Bb1 chromatic (s s s) into C2 (e).
# Development: the motif is sequenced on Ab and Db in the verse, augmented in bar 27, its glide rising through the pre, and inverted (glide down a third, two staccato steps) in chorus bar 7.
# Hook: the vocal riff ka . te . ri ri . bo . . du opens the piece with the clap (bars 1-2) and returns alone in the outro.
# Phrases: verse calls are two bars; bars 21-27 are one seven-bar lead phrase closed by a one-bar pickup run; the break's bass solo is three and a half bars.
# Signature: bar 48, all SID voices stop and the samples speak the five-syllable rhythm ka . te ri . . bo . . du.
# Surprise: bar 44, the band stops after two beats (half a bar of silence); bar 57, the key lifts a whole tone.
sidwave: 1.3
title: "Paper Circuit"
tempo: 107.41
mode: "PAL"
sids:
  - {id: "sid1", address: "$D400", model: "8580", pan: "Center", filter: {owner: "v1", route: [1]}}
  - {id: "sid2", address: "$D420", model: "8580", pan: "Center"}
instruments:
  # --- voice 1: saw slap bass. A pulse click an octave up, then the saw under a resonant low-pass that closes
  # from 1.5 kHz to about 375 Hz in 9 frames; TEST restart.
  bs:
    waveform: "saw"
    adsr: [0, 7, 10, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw"}]
    filtertable: [{cutoff: "1.5kHz", resonance: 12, type: "lowpass"}, {add: -20, frames: 9}]
  gh:
    waveform: "saw"
    adsr: [0, 4, 0, 0]
    wavetable: [{wave: "noise", note: "+24"}, {wave: "saw", frames: 2}, {gate: false}]
    filtertable: [{cutoff: "500Hz", resonance: 8, type: "lowpass"}]
  pp:
    waveform: "saw"
    adsr: [0, 9, 8, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "+31"}, {wave: "pulse", note: "+12"}, {wave: "saw"}]
    filtertable: [{cutoff: "2.6kHz", resonance: 14, type: "lowpass"}, {add: -24, frames: 10}]
  # Break solo: a narrow pulse through a band-pass that opens and then sinks; the filter type changes here.
  bp:
    waveform: "pulse"
    adsr: [0, 6, 11, 3]
    hard_restart: {test: true}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 0.2}, {add: 24, frames: 18}, {add: -24, frames: 18}]}
    filtertable: [{cutoff: "900Hz", resonance: 14, type: "bandpass"}, {add: 12, frames: 12}, {add: -3, frames: 40}]
  bend:
    waveform: "saw"
    adsr: [0, 9, 10, 10]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw"}]
    filtertable: [{cutoff: "1.5kHz", resonance: 13, type: "lowpass"}, {add: -4, frames: 60}]
  # --- voice 2: hats, clav chops, warble triads ---
  hc: {waveform: "noise", adsr: [0, 1, 0, 0], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "A#7"}, {gate: false}]}
  ho: {waveform: "noise", adsr: [0, 8, 0, 0], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "A#7", frames: 2}, {wave: "noise", note: "G#7"}]}
  hy: {waveform: "noise", adsr: [0, 4, 0, 4], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "E7", frames: 2}, {gate: false}]}
  # Clav chord chop: saw click an octave up, then the rootless voicing one frame per tone (high to low) while a
  # 10 % pulse opens in 5 frames and closes again; no sustain.
  cma:
    waveform: "pulse"
    adsr: [0, 6, 1, 4]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+11"}, {note: "+7"}, {note: "+4"}, {note: "+0"}]
    pulsetable: {steps: [{set: 0.10}, {add: 70, frames: 5}, {add: -12, frames: 20}]}
    loop: 1
  cmi: {waveform: "pulse", adsr: [0, 6, 1, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+10"}, {note: "+7"}, {note: "+3"}, {note: "+0"}], pulsetable: {steps: [{set: 0.1}, {add: 70, frames: 5}, {add: -12, frames: 20}]}, loop: 1}
  cth: {waveform: "pulse", adsr: [0, 6, 1, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+11"}, {note: "+6"}, {note: "+4"}, {note: "+0"}], pulsetable: {steps: [{set: 0.1}, {add: 70, frames: 5}, {add: -12, frames: 20}]}, loop: 1}
  csn: {waveform: "pulse", adsr: [0, 6, 1, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+15"}, {note: "+11"}, {note: "+6"}, {note: "+0"}], pulsetable: {steps: [{set: 0.1}, {add: 70, frames: 5}, {add: -12, frames: 20}]}, loop: 1}
  chd: {waveform: "pulse", adsr: [0, 6, 1, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+10"}, {note: "+6"}, {note: "+3"}, {note: "+0"}], pulsetable: {steps: [{set: 0.1}, {add: 70, frames: 5}, {add: -12, frames: 20}]}, loop: 1}
  cq: {waveform: "pulse", adsr: [0, 6, 1, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+15"}, {note: "+10"}, {note: "+5"}, {note: "+0"}], pulsetable: {steps: [{set: 0.1}, {add: 70, frames: 5}, {add: -12, frames: 20}]}, loop: 1}
  cl: {waveform: "pulse", adsr: [0, 5, 1, 2], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}], pulsetable: {steps: [{set: 0.1}, {add: 70, frames: 5}, {add: -12, frames: 20}]}, loop: 0}
  # Warble triads for the last chorus: two frames per tone, a triangle strike, a slow wide pulse.
  wmaj:
    waveform: "pulse"
    adsr: [0, 9, 6, 6]
    hard_restart: {frames: 0}
    wavetable: [{wave: "tri", note: "+12"}, {wave: "pulse", note: "+7", frames: 2}, {note: "+4", frames: 2}, {note: "+0", frames: 2}]
    pulsetable: {loop: 1, steps: [{set: 0.4}, {add: -16, frames: 40}, {add: 16, frames: 40}]}
    loop: 1
  wmin: {waveform: "pulse", adsr: [0, 9, 6, 6], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+12"}, {wave: "pulse", note: "+7", frames: 2}, {note: "+3", frames: 2}, {note: "+0", frames: 2}], pulsetable: {loop: 1, steps: [{set: 0.4}, {add: -16, frames: 40}, {add: 16, frames: 40}]}, loop: 1}
  # --- voice 3 ---
  # Glide lead: a saw frame a fifth up, then pulse opening from 12 % to 28 % and breathing; portamento 4;
  # vibrato 0.35 semitone at 5.8 Hz that starts after 15 frames and grows over 18.
  gd:
    waveform: "pulse"
    adsr: [0, 8, 11, 6]
    portamento: 4
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+7"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 0.12}, {add: 55, frames: 12}, {add: -9, frames: 60}, {add: 9, frames: 60}]}
    vibrato: {depth: 0.35, rate: 5.8, delay: 15, fade: 18}
  gst: {waveform: "pulse", adsr: [0, 6, 2, 3], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+7"}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.12}, {add: 55, frames: 12}, {add: -9, frames: 60}, {add: 9, frames: 60}]}, vibrato: {depth: 0.35, rate: 5.8, delay: 15, fade: 18}}
  gscp: {waveform: "pulse", adsr: [0, 8, 11, 6], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "-2"}, {wave: "pulse", note: "-2", frames: 2}, {note: "-1", frames: 2}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.12}, {add: 55, frames: 12}, {add: -9, frames: 60}, {add: 9, frames: 60}]}, vibrato: {depth: 0.35, rate: 5.8, delay: 15, fade: 18}}
  gfall: {waveform: "pulse", adsr: [0, 8, 11, 6], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+7"}, {wave: "pulse", frames: 10}, {note: "-1"}, {note: "-2"}, {note: "-4"}, {note: "-6"}, {note: "-9", gate: false}], pulsetable: {loop: 2, steps: [{set: 0.12}, {add: 55, frames: 12}, {add: -9, frames: 60}, {add: 9, frames: 60}]}, vibrato: {depth: 0.35, rate: 5.8, delay: 15, fade: 18}}
  gmrd: {waveform: "pulse", adsr: [0, 8, 11, 6], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+7"}, {wave: "pulse", frames: 2}, {note: "-1", frames: 2}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.12}, {add: 55, frames: 12}, {add: -9, frames: 60}, {add: 9, frames: 60}]}, vibrato: {depth: 0.35, rate: 5.8, delay: 15, fade: 18}}
  # Horn (chorus): pulse strike an octave up, six saw frames, then saw+pulse whose width breathes, so the
  # brass colour keeps moving; wider, later vibrato that swells over 24 frames.
  hn:
    waveform: "saw"
    adsr: [1, 8, 12, 6]
    portamento: 4
    hard_restart: {frames: 0}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw", frames: 6}, {wave: "saw+pulse"}]
    pulsetable: {loop: 1, steps: [{set: 0.5}, {add: -12, frames: 40}, {add: 12, frames: 40}]}
    vibrato: {depth: 0.45, rate: 6.5, delay: 18, fade: 24}
  hscp: {waveform: "saw", adsr: [1, 8, 12, 6], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw", note: "-2", frames: 2}, {wave: "saw", note: "-1", frames: 3}, {wave: "saw+pulse"}], pulsetable: {loop: 1, steps: [{set: 0.5}, {add: -12, frames: 40}, {add: 12, frames: 40}]}, vibrato: {depth: 0.45, rate: 6.5, delay: 18, fade: 24}}
  # Whistle (last chorus): a noise breath, triangle, then triangle+pulse with a slow width sweep; the
  # deepest and earliest vibrato in the piece, growing over 16 frames.
  wh:
    waveform: "tri"
    adsr: [0, 6, 12, 7]
    portamento: 4
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "+12"}, {wave: "tri", frames: 8}, {wave: "tri+pulse"}]
    pulsetable: {loop: 1, steps: [{set: 0.3}, {add: 10, frames: 50}, {add: -10, frames: 50}]}
    vibrato: {depth: 0.5, rate: 6.8, delay: 10, fade: 16}
  wscp: {waveform: "tri", adsr: [0, 6, 12, 7], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "+12"}, {wave: "tri", note: "-2", frames: 3}, {wave: "tri", note: "-1", frames: 3}, {wave: "tri+pulse"}], pulsetable: {loop: 1, steps: [{set: 0.3}, {add: 10, frames: 50}, {add: -10, frames: 50}]}, vibrato: {depth: 0.5, rate: 6.8, delay: 10, fade: 16}}
  lend: {waveform: "tri", adsr: [0, 6, 12, 11], portamento: 4, hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "+12"}, {wave: "tri", frames: 8}, {wave: "tri+pulse"}], pulsetable: {loop: 1, steps: [{set: 0.3}, {add: 10, frames: 50}, {add: -10, frames: 50}]}, vibrato: {depth: 0.5, rate: 6.8, delay: 10, fade: 16}}
samples:
  rate: 4000
  defs:
    kick: {synth: {layers: [{osc: "sine", freq: 170, to: 42, ms: 240}, {osc: "noise", ms: 4, gain: 0.6}], env: {a: 0, d: 220, s: 0, r: 20}, drive: 1.8, seed: 21}}
    snare: {synth: {layers: [{osc: "triangle", freq: 190, to: 150, ms: 80, gain: 0.7}, {osc: "noise", ms: 180}], env: {a: 0, d: 150, s: 0, r: 30}, hp: 160, seed: 4}}
    clap: {synth: {osc: "noise", notes: "C4:8 r:6 C4:8 r:6 C4:130", env: {a: 0, d: 100, s: 0, r: 30}, hp: 800, seed: 9}}
    tomhi: {synth: {layers: [{osc: "sine", freq: 240, to: 150, ms: 220}, {osc: "noise", ms: 6, gain: 0.4}], env: {a: 0, d: 200, s: 0, r: 20}, seed: 2}}
    tomlo: {synth: {layers: [{osc: "sine", freq: 150, to: 88, ms: 280}, {osc: "noise", ms: 6, gain: 0.4}], env: {a: 0, d: 260, s: 0, r: 20}, seed: 3}}
    # Five syllables at pitches common to F minor and G minor (C Eb F Bb G), a noise consonant then a formant vowel.
    ka: {synth: {layers: [{osc: "noise", ms: 14, gain: 0.7}, {osc: "saw", freq: "C4", ms: 170}], formant: "a", env: {a: 3, d: 150, s: 0.3, r: 40}, seed: 31}}
    te: {synth: {layers: [{osc: "noise", ms: 10, gain: 0.5}, {osc: "saw", freq: "Eb4", ms: 150}], formant: "e", env: {a: 3, d: 130, s: 0.3, r: 35}, seed: 32}}
    ri: {synth: {layers: [{osc: "noise", ms: 8, gain: 0.4}, {osc: "saw", freq: "F4", ms: 140}], formant: "i", env: {a: 4, d: 120, s: 0.3, r: 30}, seed: 33}}
    bo: {synth: {layers: [{osc: "noise", ms: 12, gain: 0.5}, {osc: "saw", freq: "Bb3", ms: 200}], formant: "o", env: {a: 3, d: 180, s: 0.3, r: 45}, seed: 34}}
    du: {synth: {layers: [{osc: "noise", ms: 10, gain: 0.4}, {osc: "saw", freq: "G3", ms: 260}], formant: "u", env: {a: 5, d: 230, s: 0.3, r: 60}, seed: 35}}
    # Chord hits: four saws and a noise burst through a low-pass, at fixed pitches.
    hdb: {synth: {layers: [{osc: "saw", freq: "Db3", ms: 330}, {osc: "saw", freq: "F3", ms: 330, gain: 0.8}, {osc: "saw", freq: "Ab3", ms: 330, gain: 0.8}, {osc: "saw", freq: "Db4", ms: 330, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 300, s: 0, r: 40}, lp: 1800, drive: 1.3, seed: 5}}
    heb: {synth: {layers: [{osc: "saw", freq: "Eb3", ms: 330}, {osc: "saw", freq: "G3", ms: 330, gain: 0.8}, {osc: "saw", freq: "Bb3", ms: 330, gain: 0.8}, {osc: "saw", freq: "Eb4", ms: 330, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 300, s: 0, r: 40}, lp: 1800, drive: 1.3, seed: 6}}
    hfm: {synth: {layers: [{osc: "saw", freq: "F3", ms: 330}, {osc: "saw", freq: "Ab3", ms: 330, gain: 0.8}, {osc: "saw", freq: "C4", ms: 330, gain: 0.8}, {osc: "saw", freq: "F4", ms: 330, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 300, s: 0, r: 40}, lp: 1800, drive: 1.3, seed: 7}}
    hab: {synth: {layers: [{osc: "saw", freq: "Eb3", ms: 330}, {osc: "saw", freq: "Ab3", ms: 330, gain: 0.8}, {osc: "saw", freq: "C4", ms: 330, gain: 0.8}, {osc: "saw", freq: "Eb4", ms: 330, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 300, s: 0, r: 40}, lp: 1800, drive: 1.3, seed: 8}}
    hff: {synth: {layers: [{osc: "saw", freq: "F3", ms: 330}, {osc: "saw", freq: "A3", ms: 330, gain: 0.8}, {osc: "saw", freq: "C4", ms: 330, gain: 0.8}, {osc: "saw", freq: "F4", ms: 330, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 300, s: 0, r: 40}, lp: 1800, drive: 1.3, seed: 9}}
    hgm: {synth: {layers: [{osc: "saw", freq: "G3", ms: 420}, {osc: "saw", freq: "Bb3", ms: 420, gain: 0.8}, {osc: "saw", freq: "D4", ms: 420, gain: 0.8}, {osc: "saw", freq: "G4", ms: 420, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 400, s: 0, r: 60}, lp: 1800, drive: 1.3, seed: 10}}
    hbb: {synth: {layers: [{osc: "saw", freq: "F3", ms: 330}, {osc: "saw", freq: "Bb3", ms: 330, gain: 0.8}, {osc: "saw", freq: "D4", ms: 330, gain: 0.8}, {osc: "saw", freq: "F4", ms: 330, gain: 0.6}, {osc: "noise", ms: 25, gain: 0.5}], env: {a: 0, d: 300, s: 0, r: 40}, lp: 1800, drive: 1.3, seed: 11}}
  voices:
    - {sid: "sid2", sample: "hff", at_beat: [{bar: 58, beat: 1}, {bar: 58, beat: 2.5}, {bar: 58, beat: 3.5}, {bar: 62, beat: 1}, {bar: 62, beat: 2.5}, {bar: 62, beat: 3.5}]}
# Kit keys must be single letters that are not notes: j n i w q are the syllables ka te ri bo du, v z o p are
# the chorus hits Db Eb Fm Ab/Eb, l y the last chorus's Gm and Bb/F (the F hit,
# with no letter left, is scheduled under samples.voices);
# h is the closed SID hat, and the open and accent hats are written as C3@ho and C3@hy.
kit:
  k: "sample:kick"
  s: "sample:snare"
  x: "sample:clap"
  t: "sample:tomhi"
  u: "sample:tomlo"
  j: "sample:ka"
  n: "sample:te"
  i: "sample:ri"
  w: "sample:bo"
  q: "sample:du"
  v: "sample:hdb"
  z: "sample:heb"
  o: "sample:hfm"
  p: "sample:hab"
  l: "sample:hgm"
  y: "sample:hbb"
  h: "hc"
voices:
  - id: 1
    name: "Slap bass"
    role: "bass"
    instrument: "bs"
    patterns:
      gf1: {groove: "F1 ~ - F2@gh Ab1 A1 Bb1 C2 ~ - F2@pp - Eb2 - (C2 Eb2)", length: 0.25, bars: 1}
      gb1: {groove: "Bb1 ~ - Bb2@gh D2 - Ab2@pp G2 ~ - Bb1 Bb2@pp - F2 D2 C2", length: 0.25, bars: 1}
      gd1: {groove: "Db2 ~ - Db3@gh Ab1 - Db2 F2 ~ - Db3@pp - Ab2 F2 Eb2 D2", length: 0.25, bars: 1}
      gc1: {groove: "C2 ~ - C3@gh E2 G2 Bb2@pp - C2 - C3@pp Bb2 G2 E2 Eb2 E2", length: 0.25, bars: 1}
      gf2: {groove: "F1 ~ - F2@gh Ab1 A1 Bb1 C2 ~ - Eb2@pp F2 - F1 Ab1 A1", length: 0.25, bars: 1}
      gb2: {groove: "Bb1 ~ Bb2@pp - Bb1@gh D2 F2 Ab2@pp ~ G2 - F2@gh D2 - Bb1 C2", length: 0.25, bars: 1}
      gd2: {groove: "Db2 ~ Db3@pp - Db2@gh F2 Ab2 C3@pp ~ Ab2 - F2@gh Db2 - C2 B1", length: 0.25, bars: 1}
      gc2: {groove: "C2 ~ - C3@pp - Bb2 G2 E2 C2 - Db2 D2 Eb2 E2 - -", length: 0.25, bars: 1}
      va: {groove: "Ab1 ~ - Ab2@gh C2 Eb2 G2@pp - Ab1 - Ab2@pp G2 Eb2 C2 (Ab1 G1)", length: 0.25, bars: 1}
      vg: {groove: "G1 ~ - G2@gh Db2 - F2@pp - C2 ~ - C3@gh E2 G2 Bb2@pp E2", length: 0.25, bars: 1}
      vfe: {groove: "F1 ~ - F2@gh Ab1 A1 Bb1 C2 G1 ~ - G2@gh Bb1 Eb2 G2@pp Ab1", length: 0.25, bars: 1}
      vab: {groove: "Ab1 ~ - Ab2@gh Eb2 - G2@pp Ab2 Bb1 ~ - Bb2@gh Db2 F2 Ab2@pp C2", length: 0.25, bars: 1}
      vg2: {groove: "G1 ~ - G2@pp Db2 F2 - G1 C2 ~ - C3@pp Bb2 G2 E2 C2", length: 0.25, bars: 1}
      vfe2: {groove: "F1 ~ - F2@gh Ab1 A1 Bb1 C2 Eb1 ~ - Eb2@pp F1 Ab1 C2 Eb2", length: 0.25, bars: 1}
      vdc: {groove: "Db2 ~ - Db3@pp B1 Ab1 F1 Ab1 C2 ~ - C3@pp Bb2 G2 C2 B1", length: 0.25, bars: 1}
      p1: {groove: "Bb1 ~ - Bb2@gh Db2 F2 Ab2@pp - Bb1 ~ - Bb2@pp - F2 Db2 B1", length: 0.25, bars: 1}
      p2: {groove: "C2 ~ - C3@gh F2 G2 Bb2@pp - C2 ~ C3@pp - G2 F2 (Bb1 A1)", length: 0.25, bars: 1}
