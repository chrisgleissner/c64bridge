# Stereo sequencer piece | 93.98 BPM | D Dorian | 2 SIDs (left, right)
# Techniques: A sequencer ostinato whose dotted-eighth echo on the other SID fills every missing sixteenth, a per-note band-pass blip on each SID with a darker filter on the right, a centred bass mirrored onto the right SID in the same call with TEST restart, a glide lead whose vibrato fades in after its delay (SIDWAVE 1.3), scoops, fall-offs and mordents, hand-written echoes at levels 8, 5 and 3, a five-sixteenth cell against the bar, kick and hat shared with the bass, and a canon at the diatonic fifth two beats behind across the stereo field.
# Learn: A delay is a compositional device when the source leaves space for it: the sixteenth cell D3 - - - A3 - - - F3 - - - C4 - - - has gaps for the dotted-eighth echo; a melody with composed gaps is answered by itself, and the same melody two beats later a fifth higher is a canon.
# Form (68 bars, 2:55): Sequence 1-8 (0:00; the left plays alone for 4 bars, the right echo enters in bar 5) | Layer 9-20 (0:20; centred bass pedal, the left filter opens, one ostinato note changes every 2 bars) | Theme 21-36 (0:51; lead with composed gaps, right-side echoes) | Shift 37-44 (1:32; Bb Lydian, five-sixteenth cell, the motif augmented) | Canon 45-60 (1:52; kick and hat, the right SID plays the theme two beats later a diatonic fifth higher; climax bars 51-56) | Dissolve 61-68 (2:33; the ostinato loses a note per bar)
#
# Motif: ostinato D3 A3 F3 C4 at sixteenth-grid positions 1, 5, 9, 13 (degrees 1 5 3 7); its echo 0.75 beat later fills
# positions 4, 8, 12, 16. Theme: A4 (h less a sixteenth) glides to C5 (q.), B4 (e.) | G4 (e.), rest, E5
# (h, anticipated by a sixteenth) with a fall-off (degrees 5 - 7 6 | 4 - 2'). Characteristic interval: the rising major sixth G4-E5
# across the rest. Tempo: 93.98 BPM at speed 1 (8 frames per sixteenth, echo 24 frames). The planned 100.25 BPM at speed 2 needs
# about 12,400 cycles per call for six voices with tables, vibrato and glides against 8,778 available at 1 MHz.
# Harmony: Sequence and Layer on a D pedal; the ostinato substitutes one note every 2 bars (C->D, F->G, A->B, D->E, D->C#), so the
# pedal is coloured Dm7, Dsus4, Dm6, G6/D and A7/D. Theme: Dm9 Dm9 G7 G7 | Cmaj7 Cmaj7 Am7 E7 | Bbmaj7 Bbmaj7 C A7 | Dm9 Gm6-A7 Dm Dm
# (E7, Bbmaj7, Gm6 and A7 lie outside D Dorian; harmonic rhythm doubles in bars 28, 32 and 34). Shift: Bb Lydian over a Bb-C
# bass, then A7. Canon: Am9 Am9 Dm9 Dm9 C G F Em F Am C Em Am Dm Em Am. Dissolve: Dm, Bbmaj7, A7sus, D.
# Signature, bar 5: the ostinato moves to the echoed left voice; from here the right SID sounds on every odd sixteenth.
# Surprise, bar 37: the cut to Bb Lydian and the five-sixteenth cell (the echo still at 3/16 now drifts against the bar).
# Layout: left (Left 3) v1 ostinato (filter owner), v2 bass and kit, v3 lead. Right (Right 3) v4 echo of v1 (filter owner, a
# darker offset in every section), the centred mirror of v2 (channel 2, written with v2 in the same call), v6 scored: hand-written echoes, then the canon follower.
# Bars 1-4 play the ostinato on v3, so the echo of v1 cannot sound before bar 5.
# Accepted lint: LEVEL-NOOP on the kick and hat in the canon. The centred bass voice marks every note as level-targeted; the kit
# has sustain 0 by design and its loudness comes from the attack and decay.
sidwave: 1.3
title: Parallax Letters
tempo: 93.98
mode: PAL
accent: 2
sids:
  - { id: left, address: "$D400", model: "8580", volume: 15, pan: "Left 3", filter: { owner: v1, route: [1] } }
  - { id: right, address: "$D420", model: "8580", volume: 15, pan: "Right 3", filter: { owner: v4, route: [1] } }
kit: { k: kick, h: hat }
instruments:
  # Sequencer pluck: octave saw click, then a pulse that narrows; a band-pass blip from 2.8 kHz down to about 370 Hz.
  seq:
    waveform: pulse
    pulse_width: 1200
    adsr: [0, 7, 5, 4]
    wavetable: [{ wave: saw, note: "+12" }, { wave: pulse }]
    pulsetable: [{ set: 1200 }, { add: -30, frames: 20 }]
    filtertable: [{ cutoff: 2.8kHz, resonance: 12, type: bandpass }, { add: -70, frames: 5 }, { add: -4, frames: 10 }]
  seqdry:
    waveform: pulse
    pulse_width: 1200
    adsr: [0, 7, 5, 4]
    wavetable: [{ wave: saw, note: "+12" }, { wave: pulse }]
    pulsetable: [{ set: 1200 }, { add: -30, frames: 20 }]
  seq5:
    waveform: pulse
    pulse_width: 2600
    adsr: [0, 8, 4, 5]
    wavetable: [{ wave: tri, note: "+24" }, { wave: pulse }]
    pulsetable: [{ set: 2600 }, { add: 40, frames: 12 }]
    filtertable: [{ cutoff: 1.8kHz, resonance: 14, type: bandpass }, { add: -40, frames: 6 }]
  bass:
    waveform: pulse
    pulse_width: 2048
    adsr: [0, 6, 12, 4]
    hard_restart: { test: true }
    wavetable: [{ note: "+12" }, { wave: pulse }]
    pulsetable: [{ set: 2048 }, { add: -86, frames: 16 }]
  pedal:
    waveform: pulse
    pulse_width: 1800
    adsr: [1, 8, 12, 6]
    hard_restart: { test: true }
    wavetable: [{ note: "+12" }, { wave: pulse }]
    pulsetable: { reset: false, loop: 1, steps: [{ set: 1800 }, { add: -8, frames: 120 }, { add: 8, frames: 120 }] }
  kick:
    waveform: pulse
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: A6 }, { wave: pulse, note: A3, slide_to: D2, frames: 3 }, { wave: tri, note: D2, frames: 1 }, { gate: false }]
  hat:
    waveform: noise
    adsr: [0, 4, 0, 0]
    wavetable: [{ wave: noise, note: G7 }, { gate: false }]
  # Glide lead: saw click, pulse opening fast then breathing; vibrato 0.35 semitone at 6 Hz after 20 frames.
  lead:
    waveform: pulse
    pulse_width: 400
    adsr: [1, 5, 10, 5]
    portamento: 6
    vibrato: { depth: 0.35, rate: 6, delay: 20, fade: 30 }
    wavetable: [{ wave: saw }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 400 }, { add: 50, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
  lead_hi:
    waveform: pulse
    pulse_width: 800
    adsr: [1, 5, 11, 5]
    vibrato: { depth: 0.5, rate: 6.5, delay: 15, fade: 30 }
    wavetable: [{ wave: saw }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 800 }, { add: 40, frames: 20 }, { add: -10, frames: 40 }, { add: 10, frames: 40 }] }
  mord:
    waveform: pulse
    pulse_width: 400
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6, delay: 20, fade: 30 }
    wavetable: [{ wave: saw }, { wave: pulse, frames: 3 }, { note: "+2", frames: 3 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 400 }, { add: 50, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
  mord1:
    waveform: pulse
    pulse_width: 400
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6, delay: 20, fade: 30 }
    wavetable: [{ wave: saw }, { wave: pulse, frames: 3 }, { note: "+1", frames: 3 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 400 }, { add: 50, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
  grace:
    waveform: pulse
    pulse_width: 400
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6, delay: 20, fade: 30 }
    wavetable: [{ wave: saw, note: "-1", frames: 2 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 400 }, { add: 50, frames: 18 }, { add: -12, frames: 45 }, { add: 12, frames: 45 }] }
  lead_soft:
    waveform: tri
    adsr: [3, 6, 11, 7]
    portamento: 8
    vibrato: { depth: 0.45, rate: 5.5, delay: 25, fade: 45 }
    wavetable: [{ wave: noise }, { wave: tri }]
  # Right side: echoes are narrower and softer; the canon follower is a saw with its own vibrato.
  echo_r:
    waveform: pulse
    pulse_width: 700
    adsr: [2, 6, 9, 5]
    portamento: 6
    vibrato: { depth: 0.25, rate: 6, delay: 20 }
    wavetable: [{ wave: tri }, { wave: pulse }]
    pulsetable: { loop: 1, steps: [{ set: 700 }, { add: -8, frames: 40 }, { add: 8, frames: 40 }] }
  canon_r:
    waveform: saw
    adsr: [1, 6, 9, 6]
    portamento: 6
    vibrato: { depth: 0.3, rate: 5.5, delay: 18, fade: 30 }
    wavetable: [{ wave: pulse }, { wave: saw }]
