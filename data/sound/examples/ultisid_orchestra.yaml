        length: 4
        groove:
          ["A4", "F4"]
      Wind:
        length: 4
        groove:
          ["A4", "F4", "C4", "G4"]
      Cross:
        length: 4
        groove:
          ["D4", "F4", "Bb4", "E4"]
      Return:
