# Chip orchestra | 100 BPM | D minor | 8 SIDs, 24 voices
# Techniques: Detuned unison strings, two spatial echo leads, bass, harp arpeggios and a six-part kit; split UltiSID stereo.
# Learn: Bring the orchestra in by desks, pull back for the reed answer, then let both winds and percussion meet in the return
sidwave: 1.2
title: An Atlas of Wind
tempo: 100
mode: PAL
cpu: "turbo"
sids: {"layout": "ultisid8", "overrides": {"sid1": {"volume": 9, "pan": "Left 5"}, "sid2": {"volume": 9}, "sid3": {"volume": 7}, "sid4": {"volume": 7}, "sid5": {"volume": 9, "pan": "Right 5"}, "sid6": {"volume": 9}, "sid7": {"volume": 7}, "sid8": {"volume": 7}}}
instruments:
  wind: {"waveform": "pulse", "adsr": [2, 3, 8, 5], "pulse_width": 1310, "vibrato": {"depth": 0.23, "rate": 4, "delay": 12}}
  reed: {"waveform": "tri", "adsr": [2, 4, 7, 4], "vibrato": {"depth": 0.19, "rate": 3, "delay": 10}}
  silk: {"waveform": "pulse", "adsr": [6, 4, 7, 8], "pulse_width": 1550, "pulsetable": {"steps": [{"set": 1550}, {"add": 8, "frames": 47}, {"add": -8, "frames": 47}], "loop": 1}}
  low: {"waveform": "saw", "adsr": [1, 5, 8, 4]}
  bassoon: {"waveform": "tri", "adsr": [3, 4, 6, 5]}
  harp: {"waveform": "pulse", "adsr": [0, 5, 4, 4], "pulse_width": 975}
  bow: {"waveform": "tri", "adsr": [4, 4, 6, 5]}
  kettle: {"waveform": "tri", "adsr": [0, 4, 7, 4], "wavetable": [{"wave": "noise", "note": "D5"}, {"wave": "tri", "note": "+7"}, {"note": "+0", "frames": 6}]}
voices:
  - id: 1
    name: "First wind call"
    instrument: "wind"
    patterns:
      Dawn:
        length: 1
        groove:
          ["A4", "-", "C5", "D5", "-", "F5", "E5", "D5"]
      Wind:
        length: 1
        groove:
          ["A4", "C5", "D5", "~", "F5", "E5", "D5", "~", "A4", "C5", "F5", "~", "E5", "D5", "C5", "-"]
      Cross:
        length: 1
        groove:
          ["Bb4", "D5", "G5", "~", "F5", "D5", "Bb4", "-", "G5", "E5", "D5", "~", "C#5", "E5", "A5", "-"]
      Return:
        length: 1
        groove:
          ["D5", "F5", "A5", "~", "G5", "A5", "C6", "~", "A5", "F5", "D5", "~", "E5", "G5", "C#5", "-"]
      Harbor:
        length: 1
        groove:
          ["A5", "F5", "E5", "D5", "D5", "~", "~", "~"]
  - id: 2
    name: "String desk high L"
    instrument: "silk"
