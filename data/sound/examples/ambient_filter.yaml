# Ambient | 68.35 BPM | D in-scale (D Eb G A Bb) | 1 SID
# Techniques: A night garden on one 8580: a pulse drone whose slow width sweep makes its fifth harmonic bloom and fade, noise wind through a looping resonant band-pass, a triangle flute with a one-frame noise breath, scoops, fall-offs and vibrato that fades in after its delay (SIDWave 1.3), a pulse koto with an octave click and bent plucks, ring-modulated bells over a hidden source note, five-sixteenth water figures with a band-pass blip on every drop and a low thud sharing their voice, looping maj7 and m9 broken-chord wavetables, and a held note that bends a semitone before its vibrato starts.
# Learn: Stillness is composed from moving tables, not from more notes; one change of drone (bar 29) carries the whole harmonic arc, and a single note from outside the scale (the flute's F5, bar 29 beat 3) is the event the first 28 bars prepare
# Form (48 bars, 2:48): Stillness 1-8 (0:00) | Flute 9-20 (0:28, phrases of 3, 2.5 and 4.25 bars: the second phrase's fall-off is the pickup of the third, which runs into bar 20 under the koto) | Water 21-28 (1:10, drone gone, plucks in groups of five sixteenths against the bar, groups thin at first and fill as the chip volume rises, half a bar of bells alone in bar 27) | Dusk 29-36 (1:38, drone Bb then G, flute in its top register, filter fully open, climax bar 34 on the only Eb6) | Return 37-44 (2:06, the motif inverted, the F from Dusk kept, drone in the Dusk timbre on D) | Last 45-48 (2:34, one pluck, the wind closes)
#
# Motif (scale degrees of D Eb G A Bb = 1 2 3 4 5): 4 (h., scooped from 3) - 5 - 4 (q) - 3 (e) - 1 (h). Characteristic interval: the
# semitone turn A-Bb-A. Answer: 1' 5 4 3 2 1 from D5 in uneven lengths. Water: the motif heads one group of five sixteenths each
# (augmentation). Dusk: the A-Bb-A turn sequenced upward (A5 Bb5 A5 D6, then Eb6 falling to D6) over Gm9. Return: the motif
# inverted (A G A Bb Eb5) and the answer rising with Dusk's F in place of Eb (D4 F4 G4 A4 Bb4 D5).
# Harmony: drone and scale only; the Eb against D is the tension. Pedal D (1-20), no pedal (21-28), Bb with Bbmaj7 broken chords
# (29-32), G with Gm9 (33-35), Ebmaj7 (36, a Lydian colour under the flute's A), D (37-48).
# Signature and surprise, bar 29: the drone leaves D for the first time (Bb1) and the flute holds A5 straight for 1.5 beats, bends
# up a semitone over 20 frames, gains vibrato only after the bend (vibrato delay 88 frames, fade 30) and falls a fourth to F5 on
# beat 3, the first note outside the scale. The glass Bbmaj7 enters on the same beat, so the F belongs to the flute first.
# Voices: v1 drone, then the hidden ring source of the bells (Water), then drone again. v2 koto, then bells, then maj7/m9 glass
# arps, then koto with the thud. v3 (filter owner, the only filtered channel) wind, flute, water plucks with the thud, bright flute, dark flute, wind.
# Accepted lint: none.
sidwave: 1.3
title: "Blue Current"
tempo: 68.35
mode: "PAL"
sids:
  - {id: "sid1", address: "$D400", model: "8580", filter: {owner: "v3", route: [3]}}
instruments:
  # Drone: pulse width sweeps 50 % -> 21 % over 4.8 s and back; at 50 % the third harmonic (the fifth, A2) is strongest.
  drone:
    waveform: "pulse"
    pulse_width: 2048
    adsr: [12, 9, 12, 11]
    hard_restart: {frames: 0}
    pulsetable: {reset: false, loop: 1, steps: [{set: 2048}, {add: -5, frames: 240}, {add: 5, frames: 240}]}
  drone_dusk:
    waveform: "pulse"
    pulse_width: 2048
    adsr: [11, 9, 12, 11]
    hard_restart: {frames: 0}
    pulsetable: {reset: false, loop: 1, steps: [{set: 2048}, {add: -2, frames: 150}, {add: 2, frames: 150}]}
  # Wind: noise through a band-pass that loops 600 Hz -> 2.5 kHz -> 600 Hz over 300 frames.
  wind:
    waveform: "noise"
    adsr: [11, 0, 15, 10]
    filtertable: {reset: false, loop: 1, steps: [{cutoff: "600Hz", resonance: 12, type: "bandpass"}, {add: 2, frames: 150}, {add: -2, frames: 150}]}
  wind_close:
    waveform: "noise"
    adsr: [9, 0, 15, 12]
    filtertable: [{cutoff: "2.4kHz", resonance: 13, type: "bandpass"}, {add: -1, frames: 255}, {add: -1, frames: 40}]
  # Flute colours. Every one starts with a frame of noise at the note's own rate (the breath) and holds without a pitch step.
  flute:
    waveform: "triangle"
    adsr: [4, 6, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "tri"}]
    filtertable: {reset: false, loop: 1, steps: [{cutoff: "1.6kHz", resonance: 5, type: "lowpass"}, {add: 1, frames: 90}, {add: -1, frames: 90}]}
    vibrato: {depth: 0.45, rate: 4.5, delay: 30, fade: 40}
  flute_mord:
    waveform: "triangle"
    adsr: [4, 6, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "tri", frames: 3}, {note: "+1", frames: 3}, {wave: "tri"}]
    filtertable: {reset: false, loop: 1, steps: [{cutoff: "1.6kHz", resonance: 5, type: "lowpass"}, {add: 1, frames: 90}, {add: -1, frames: 90}]}
    vibrato: {depth: 0.45, rate: 4.5, delay: 30, fade: 40}
  flute_mord2:
    waveform: "triangle"
    adsr: [4, 6, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "tri", frames: 3}, {note: "+2", frames: 3}, {wave: "tri"}]
    filtertable: {reset: false, loop: 1, steps: [{cutoff: "1.6kHz", resonance: 5, type: "lowpass"}, {add: 1, frames: 90}, {add: -1, frames: 90}]}
    vibrato: {depth: 0.3, rate: 5.5, delay: 20, fade: 30}
  flute_trill:
    waveform: "triangle"
    adsr: [4, 6, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "tri", note: "+0", frames: 3}, {note: "+2", frames: 3}]
    filtertable: {steps: [{cutoff: "1.8kHz", resonance: 5, type: "lowpass"}, {add: 3, frames: 40}]}
    loop: 1
  flute_dark:
    waveform: "triangle"
    adsr: [5, 6, 11, 8]
    wavetable: [{wave: "noise"}, {wave: "tri"}]
    filtertable: {reset: false, loop: 1, steps: [{cutoff: "1.2kHz", resonance: 6, type: "lowpass"}, {add: 1, frames: 120}, {add: -1, frames: 120}]}
    vibrato: {depth: 0.3, rate: 5.5, delay: 20, fade: 30}
  # Dusk: a pulse flute whose width opens fast and then breathes; the section offset opens its low-pass completely.
  flute_hi:
    waveform: "pulse"
    pulse_width: 300
    adsr: [3, 7, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 40, frames: 20}, {add: -6, frames: 50}, {add: 6, frames: 50}]}
    filtertable: [{cutoff: "1.2kHz", resonance: 7, type: "lowpass"}, {add: 2, frames: 60}]
    vibrato: {depth: 0.4, rate: 5.5, delay: 22, fade: 35}
  # The signature note: straight for 88 frames (the held A5 and its 20-frame bend), then vibrato.
  flute_sig:
    waveform: "pulse"
    pulse_width: 300
    adsr: [3, 7, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 30, frames: 30}, {add: -5, frames: 60}, {add: 5, frames: 60}]}
    filtertable: [{cutoff: "1.2kHz", resonance: 7, type: "lowpass"}, {add: 2, frames: 60}]
    vibrato: {depth: 0.5, rate: 5, delay: 88, fade: 30}
  hi_mord:
    waveform: "pulse"
    pulse_width: 300
    adsr: [3, 7, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "pulse", frames: 3}, {note: "+1", frames: 3}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 40, frames: 20}, {add: -6, frames: 50}, {add: 6, frames: 50}]}
    filtertable: [{cutoff: "1.2kHz", resonance: 7, type: "lowpass"}, {add: 2, frames: 60}]
    vibrato: {depth: 0.4, rate: 5.5, delay: 22, fade: 35}
  # The climax note: deeper, faster vibrato that fades in over 40 frames.
  flute_peak:
    waveform: "pulse"
    pulse_width: 500
    adsr: [2, 7, 12, 8]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 500}, {add: 50, frames: 20}, {add: -8, frames: 50}, {add: 8, frames: 50}]}
    filtertable: [{cutoff: "1.4kHz", resonance: 8, type: "lowpass"}, {add: 3, frames: 60}]
    vibrato: {depth: 0.55, rate: 6, delay: 26, fade: 40}
  hi_mord2:
    waveform: "pulse"
    pulse_width: 300
    adsr: [3, 7, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "pulse", frames: 3}, {note: "+2", frames: 3}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 40, frames: 20}, {add: -6, frames: 50}, {add: 6, frames: 50}]}
    filtertable: [{cutoff: "1.2kHz", resonance: 7, type: "lowpass"}, {add: 2, frames: 60}]
    vibrato: {depth: 0.4, rate: 5.5, delay: 22, fade: 35}
  hi_trill:
    waveform: "pulse"
    pulse_width: 300
    adsr: [3, 7, 11, 7]
    wavetable: [{wave: "noise"}, {wave: "pulse", note: "+0", frames: 3}, {note: "+2", frames: 3}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 40, frames: 20}, {add: -6, frames: 50}, {add: 6, frames: 50}]}
    filtertable: {steps: [{cutoff: "1.2kHz", resonance: 7, type: "lowpass"}, {add: 2, frames: 60}]}
    loop: 1
  # Koto: 8 % pulse with an octave click; the bent variant clicks with a saw frame instead, so it can bend.
  koto:
    waveform: "pulse"
    pulse_width: 328
    adsr: [0, 9, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 328}, {add: 8, frames: 30}]
  # Soft koto for the notes between group heads: no click, quicker decay.
  koto_s:
    waveform: "pulse"
    pulse_width: 500
    adsr: [0, 7, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "tri"}, {wave: "pulse"}]
    pulsetable: [{set: 500}, {add: 6, frames: 30}]
  koto_bend:
    waveform: "pulse"
    pulse_width: 328
    adsr: [0, 10, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw"}, {wave: "pulse"}]
    pulsetable: [{set: 328}, {add: 6, frames: 40}]
  # Water drops on the filter owner: each pluck opens a resonant band-pass at 2.2 kHz that drops to 1 kHz in 6 frames.
  koto_f:
    waveform: "pulse"
    pulse_width: 500
    adsr: [0, 8, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 500}, {add: 10, frames: 20}]
    filtertable: [{cutoff: "2.2kHz", resonance: 13, type: "bandpass"}, {add: -20, frames: 6}]
  koto_fh:
    waveform: "pulse"
    pulse_width: 700
    adsr: [0, 9, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 700}, {add: -12, frames: 30}]
    filtertable: [{cutoff: "3kHz", resonance: 14, type: "bandpass"}, {add: -40, frames: 8}]
  # Bell: triangle ring-modulated by a hidden source an octave above (voice 1 is silent in Water).
  bell:
    waveform: "triangle"
    adsr: [0, 10, 0, 9]
    wavetable: [{wave: "tri", ring: true, note: "+12", frames: 2}, {wave: "tri", ring: true}]
    source_note: "+12"
  # Glass: broken chords, high to low so the root lands last; maj7 at 3 frames per tone, m9 at 2.
  gmaj:
    waveform: "pulse"
    adsr: [2, 9, 6, 9]
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+11", frames: 3}, {note: "+7", frames: 3}, {note: "+4", frames: 3}, {note: "+0", frames: 3}]
    pulsetable: {reset: false, loop: 1, steps: [{set: 1600}, {add: -6, frames: 150}, {add: 6, frames: 150}]}
    loop: 1
  gmin:
    waveform: "pulse"
    adsr: [2, 9, 6, 9]
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+14", frames: 2}, {note: "+10", frames: 2}, {note: "+7", frames: 2}, {note: "+3", frames: 2}, {note: "+0", frames: 2}]
    pulsetable: {reset: false, loop: 1, steps: [{set: 1000}, {add: 5, frames: 150}, {add: -5, frames: 150}]}
    loop: 1
  # Thud: noise tick, then a triangle falling from D3 to D2; its own low-pass so the water band-pass does not thin it.
  thud:
    waveform: "triangle"
    adsr: [0, 9, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "G5"}, {wave: "tri", note: "D3", slide_to: "D2", frames: 4}, {wave: "tri", note: "D2", frames: 5}, {gate: false}]
    filtertable: [{cutoff: "700Hz", resonance: 4, type: "lowpass"}]
  thud2:
    waveform: "tri"
    adsr: [0, 9, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "E5"}, {wave: "tri", note: "D3", slide_to: "D2", frames: 4}, {wave: "tri", note: "D2", frames: 5}, {gate: false}]
kit: {t: "thud"}
voices:
  - id: 1
    name: "Drone and hidden ring source"
    role: "pad"
    level: 8
    instrument: "drone"
    patterns:
      still: {groove: "D1 ~ ~ ~ ~ ~ ~ ~", length: 4}
      # Tied from Stillness: no new swell under the flute entry.
      flute: {groove: "~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~ ~", length: 4}
      dusk_a: {groove: "Bb1@drone_dusk ~ ~ ~", length: 4}
      dusk_b: {groove: "G1@drone_dusk ~ ~ ~", length: 4}
      # Return keeps the Dusk drone timbre, now on D.
      ret: {groove: "D1@drone_dusk ~ ~ ~ ~ ~ ~ ~", length: 4}
      last: {groove: "~ ~ ~ -", length: 4}
  - id: 2
    name: "Koto, bells and glass"
    role: "arp"
    instrument: "koto"
    patterns:
      still:
        groove:
          - "- - - - - -"
          - {note: "A4", inst: "koto_bend", len: 1.5, bend: {to: "Bb4", frames: 8}}
          - {note: "A4", len: 0.75}
          - "G4 |"
          - {note: "D4", len: 4}
          - "| - - - - - - - - - -"
          - {note: "G3", len: 1.5}
          - "| - - - - - - - - - -"
          - {note: "D5", len: 0.5}
          - {note: "A4", len: 1}
          - "|"
          - {note: "Bb4", inst: "koto_bend", len: 2, bend: {to: "A4", frames: 10}}
          - "- - - - - - - - | - - - -"
          - {note: "G4", len: 0.75}
          - "D5"
          - {note: "Eb5", len: 2}
          - "|"
          - {note: "D5", len: 1.25}
          - {note: "A4", len: 2.75}
          - "| - - - - - - - - D3@thud2 - - -"
          - {note: "G4", len: 0.5}
          - {note: "A4", len: 0.5}
        length: 0.25
        bars: 8
      flute:
        groove:
          - "- - - - - - - -"
          - {note: "D4", len: 2}
          - "| - - - - - - - - - - - - - - - - | - - - -"
          - {note: "A3", len: 3}
          - "| - - D5 A4 Bb4 A4"
          - {note: "G4", len: 0.5}
          - {note: "D4", len: 2}
          - "| - - - - - - - -"
          - {note: "G3", len: 2}
          - "| - - - - - - - - - - - - - - - - | - - - - - - - - - G5 D5 Eb5"
          - {note: "D5", len: 0.5}
          - {note: "A4", len: 0.5}
          - "|"
          - {note: "G4", len: 1.5}
          - {note: "D4", len: 2.5}
          - "| - - - -"
          - {note: "G3", len: 3}
          - "| - - - - - - - - - - - - - - - - | - - - - - - - -"
          - {note: "A3", len: 2}
          - "| - - - - - A4 D5@koto_s Bb4@koto_s - - Bb4 Eb5@koto_s D5@koto_s - - G4"
        length: 0.25
        bars: 12
      bells: {groove: "A5@bell - - - - - - - | - - - Bb5@bell - - - - | A5@bell - - - - - G5@bell - | - - - - Eb5@bell - - - | - - D5@bell - - A5@bell - - | A5@bell - - G5@bell - Bb5@bell - - | - - - - Bb5@bell - A5@bell D5@bell | - - - G5@bell - - - A5@bell", length: 0.5, bars: 8}
      # The glass enters on beat 3 of bar 29, together with the flute's F5, so the flute introduces the F.
      glass_a: {groove: "- - - - - - Bb3@gmaj ~ | Bb3@gmaj ~ ~ Bb4@gmaj ~ ~ Bb3@gmaj ~ | Bb3@gmaj ~ ~ Bb3@gmaj ~ ~ Bb4@gmaj ~ | Bb3@gmaj ~ ~ Bb3@gmaj ~ ~ ~ ~", length: 0.5, bars: 4}
      glass_b: {groove: "G3@gmin ~ ~ G3@gmin ~ ~ G4@gmin ~ | G3@gmin ~ ~ G4@gmin ~ ~ G3@gmin ~ | G3@gmin ~ ~ G3@gmin ~ ~ G4@gmin ~ | Eb4@gmaj ~ ~ ~ ~ ~ ~ ~", length: 0.5, bars: 4}
      ret: {groove: "D3@thud2 - - - - - - - | - - - - - D4 F4 A4 | D5 - - - - - - - | Bb3@gmaj ~ ~ ~ D5 A4 Bb4 G4 | D3@thud2 - A4 - - - - - | - - - - - D3@thud2 - - | - - - - D5 Bb4 F4 G4 | D4 - - - A4 - - -", length: 0.5, bars: 8}
      last:
        groove:
          - "- - - - - - - - |"
          - {note: "A4", inst: "koto_bend", len: 4, bend: {to: "Bb4", frames: 20}}
          - "| - - - - - - - - | - - - - - - - -"
        length: 0.5
        bars: 4
  - id: 3
    name: "Wind, flute and water (filter owner)"
    role: "lead"
    instrument: "flute"
    patterns:
      wind: {groove: "D5@wind ~ ~ ~ | ~ ~ ~ ~ | ~ ~ - - | Eb5@wind ~ ~ ~ | ~ ~ ~ ~ | ~ - G4@wind ~ | ~ ~ ~ ~ | ~ ~ ~ -", length: 1, bars: 8}
      flute:
        groove:
          - "-"
          - {note: "A4", len: 2.25, portamento: 8, slide_from: "G4"}
          - {note: "Bb4", len: 0.5, legato: true}
          - {note: "A4", len: 1, legato: true}
          - "|"
          - {note: "G4", len: 0.5}
          - {note: "D4", len: 3.5}
          - "| ~ ~ ~ ~ - - - G4"
          - {note: "A4", inst: "flute_mord", len: 2}
          - "| - - - - - - - - - - - - - - - - |"
          - {note: "D5", len: 1.25, portamento: 10, slide_from: "A4"}
          - {note: "Bb4", len: 0.5}
          - {note: "A4", len: 2.25}
          - "|"
          - {note: "G4", len: 0.75}
          - "Eb4"
          - {note: "D4", len: 3}
          - "| ~ ~ ~ ~ ~ ~ - - - - - - - - - - | - - - - - - - - - -"
          - {note: "D5", len: 0.75}
          - {note: "D5", len: 0.75, legato: true, bend: {to: "A4", frames: 16}}
          - "| - -"
          - {note: "Bb4", len: 1.5, portamento: 6, slide_from: "A4"}
          - {note: "D5", len: 0.5, legato: true}
          - {note: "Bb4", len: 0.75}
          - "A4"
          - {note: "Eb5", len: 0.5}
          - "|"
          - {note: "G5", inst: "flute_trill", len: 1.5}
          - {note: "D5", len: 0.5}
          - {note: "Bb4", len: 1}
          - {note: "A4", inst: "flute_mord", len: 1}
          - "|"
          - {note: "G4", len: 0.75}
          - {note: "A4", len: 3.25}
          - "| ~ ~ ~ ~ - - - - - - - - - - - -"
        length: 0.25
        bars: 12
      water: {groove: "A4@koto_fh G5@koto_f - - D3@thud A4@koto_fh Bb4@koto_f - - - Bb4@koto_fh A5@koto_f Eb5@koto_f D5@koto_f D3@thud A4@koto_fh | Bb4@koto_f - - - G4@koto_fh D5@koto_f - - - D4@koto_fh G4@koto_f Bb4@koto_f A4@koto_f D3@thud D4@koto_fh Eb4@koto_f | - - - D5@koto_fh Bb5@koto_f G5@koto_f Eb5@koto_f D3@thud Bb4@koto_fh Eb5@koto_f D5@koto_f G5@koto_f - A4@koto_fh Eb5@koto_f - | - - A4@koto_fh D5@koto_f G5@koto_f Eb5@koto_f D3@thud G4@koto_fh D5@koto_f A4@koto_f Eb5@koto_f - Eb4@koto_fh A4@koto_f - - | D3@thud D4@koto_fh G4@koto_f Eb4@koto_f A4@koto_f - D4@koto_fh D5@koto_f A4@koto_f G4@koto_f - G4@koto_fh Bb4@koto_f Eb5@koto_f D5@koto_f D3@thud | A4@koto_fh Eb5@koto_f Bb4@koto_f G5@koto_f - Bb4@koto_fh A5@koto_f Eb5@koto_f D5@koto_f D3@thud D5@koto_fh G5@koto_f Eb5@koto_f A5@koto_f - Eb5@koto_fh | Eb5@koto_f Bb5@koto_f A5@koto_f - D5@koto_fh G5@koto_f Bb5@koto_f A5@koto_f D3@thud - - - - - - - | D5@koto_f Bb4@koto_f D3@thud G4@koto_fh - - D5@koto_f - - A5@koto_fh - - - D5@koto_f ~ ~", length: 0.25, bars: 8}
      dusk_a:
        groove:
          - {note: "A5", inst: "flute_sig", len: 1.5}
          - {note: "A5", len: 1.5, legato: true, bend: {to: "Bb5", frames: 20}}
          - {note: "Bb5", len: 1, legato: true, bend: {to: "F5", frames: 12}}
          - "| ~ ~ ~ ~ ~ ~ ~"
          - {note: "D5", inst: "flute_hi", len: 0.5}
          - {note: "Eb5", inst: "flute_hi", len: 0.5}
          - "G5@flute_hi"
          - {note: "A5", inst: "hi_mord", len: 1}
          - "|"
          - {note: "Bb5", inst: "flute_hi", len: 1.75, portamento: 6, slide_from: "A5"}
