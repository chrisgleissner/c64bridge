# Twenty-Seven Lanterns | nine-SID through-composed suite | 9 SIDs, 27 voices
# Techniques: Nine-SID orchestration across five movements; 107.41 opening, a 3:2 faster rooftop movement, a broad E-major procession and a ritardando into the lantern cadence. The socket 6581 holds the centered percussion and sub; divided strings and counterlines carry the theme across the stereo field.
# Learn: The C# pedal opens as a spare beacon, expands into the arcade and rooftop theme, shifts to E major for the procession, then returns as a widely spaced 27-part cadence. Bar 25 starts the quicker rooftop section without preparation; the last held chord transforms the opening pedal into a full sonority.
# Accepted lint: CLASH (29 brief, low-level echo tails across chord changes); LEVEL-NOOP (5 sustain-zero socket echoes).
#
# Form (88 bars, about 3:17): Flame 8 (divided high strings over a C# pedal) / Arcade 16 (theme, kick and snare, low
# desk, bells) / Rooftops 16 (new theme over A-B-G#m, hats, rhythmic mid desk, arps, bass octaves, counter-line) /
# Procession 16 (E major: counter-lines answer left and right, brass swells, toms, then the theme returns) /
# All lanterns 24 (every voice, brighter lead, climax) / Hold 8 (drums out, plagal close, all 27 voices on C# minor).
# SID roles: sid1 theme, bass octaves, echo L | sid2 low desk | sid3 counter A, arp A, brass A | sid4 high strings A,
# unison of high strings B, bell A | sid5 unisons of theme and bass, echo R | sid6 mid desk | sid7 counter B, arp B,
# brass B | sid8 high strings B, unison of high strings A, bell B | sid9 (socket, centre) kick-snare, sub bass, hats.
# Accepted lint: ONE-SIDE on v1 and v2, which are centred by unison copies on sid5 (v13, v14); all 27 channels are
# scored, so center: true has no free mirror channel. LEVEL-NOOP: library drums have sustain 0. CLASH: only where an
# echo tail (sustain 2 of 15) crosses a chord change.
