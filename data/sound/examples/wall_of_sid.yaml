# Nine-SID ensemble build | 112 BPM | C# minor | 9 SIDs, 27 voices
# Techniques: Gradual 27-voice build, layered lines with PWM and filtering, and a fitted SID in socket 1.
# Learn: Bring in three desks at a time, move through E major, and reserve every oscillator for the final C#-minor chord; use configure: true
sidwave: 1.2
title: Twenty-Seven Lanterns
tempo: 112
mode: PAL
cpu: "turbo"
sids: {"layout": "ultisid8+socket1", "overrides": {"sid1": {"volume": 8, "pan": "Left 4"}, "sid2": {"volume": 7}, "sid3": {"volume": 7}, "sid4": {"volume": 7}, "sid5": {"volume": 8, "pan": "Right 4"}, "sid6": {"volume": 7}, "sid7": {"volume": 7}, "sid8": {"volume": 7}, "sid9": {"volume": 8, "pan": "Center"}}}
instruments:
  flare: {"waveform": "saw", "adsr": [1, 4, 9, 4], "vibrato": {"depth": 0.21, "rate": 4, "delay": 9}}
  sub: {"waveform": "tri", "adsr": [2, 4, 7, 5]}
  reed: {"waveform": "pulse", "adsr": [2, 4, 6, 5], "pulse_width": 1300}
  halo: {"waveform": "pulse", "adsr": [4, 4, 5, 6], "pulse_width": 1900, "pulsetable": {"steps": [{"set": 1900}, {"add": 12, "frames": 34}, {"add": -12, "frames": 34}], "loop": 1}}
  upper: {"waveform": "tri", "adsr": [3, 5, 6, 5], "filtertable": [{"cutoff": 900, "resonance": 5}, {"add": 27, "frames": 16}]}
voices:
