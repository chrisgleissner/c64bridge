# Action game theme "Neon Run" | 136.70 BPM, speed 2 | D minor, lifted to E minor | 4/4 | 8580 | 1 SID
# Techniques: Bass, kick and snare share voice 1 under its filter; each drum has a one-step filter table (kick low-pass, snare and ghost high-pass, low snare band-pass). The bass filter is closed in the intro and opens over the form; a resonant gliding wah bass drives the drum break. Voice 2 plays explicit looping chord wavetables at 1 frame per tone (A), 2 frames (B) and 3 frames (solo), voiced so the top tone moves by step, plus hats, toms, a plucked answer voice and a counter-line. Voice 3 plays a pulse lead whose top note blooms into its own chord, ornaments as instruments (grace, mordents, trill), bends, scoops, and a hard-sync solo whose source oscillator (voice 2) is driven silently.
# Learn: The motif is three 16th pickups, a dotted figure that falls by step and a leap of a fifth held across the bar line; it is sequenced a third lower, inverted in B, traded between lead and arp voice, sung over a descending lament bass, and returns a whole step higher after the drum break.
#
# Form (PAL 50.12 Hz, 22 frames per beat, 1.756 s per bar, 88 bars, 2:35):
#   Intro   1-8   0:00  bass riff and drums under a closed filter; hats, then a plucked teaser of the motif head (bars 2-3)
#   A       9-24  0:14  theme 8 + 8 in D minor; the second ending turns to F and elides into B (its Bb5 resolves on
#                       the A5 that opens the first B call); 1-frame chord arps
#   B      25-40  0:42  F major, half-time drums; lead and arp voice trade two-beat calls (inverted motif), roles swap
#                       in the second half (grouped 3 + 3 + 2 bars); bVI (Ab) blooms
#   Solo   41-56  1:10  lament bass D C# C B Bb A (two beats each, a diminished chord on B), four 4-bar cycles:
#                       lyrical lead over 3-frame broken chords | hard-sync solo alone | 16th runs | sync climb
#   Break  57-64  1:38  drum solo: bar 57 is voice 1 alone, then wah bass glides and toms in all three voices build
#                       from -34 to -26 dB; bar 64 is a B7 stab, a silence (the surprise) and the pickup in the new key
#   A'     65-72  1:52  E minor (a whole step up), counter-line in the arp voice; climax bar 69: D6 bloom over Em7,
#                       the loudest bar, 77 % of the length
#   A'b    73-80  2:06  one volume step lower, 1-frame arps again, the bloom a tone lower (C6)
#   Coda   81-88  2:20  stop-time unison riff answered by drum fills, the motif, an octave fall (bar 86), C D and one
#                       cut E
# Motif (D minor, scale degrees, 16ths): 5 b7 1 | b3 (dotted 8th) 2 (16th) 1 (8th) 5' (and of 2, tied over the bar)
#   | 5' falls to 4' by a 4-frame bend, b3 2 (16ths), 1 (dotted quarter, late vibrato). Characteristic interval: the
#   rising fifth D5-A5 held across the bar line, then the Phrygian Eb against the E natural of the first bar.
# Harmony: A  Dm | Eb/D | C Bb | A7sus A7 | Dm | F/C | Bbmaj7 | Gm6 A7 | ... | Dm7 | F/C | Bbmaj7 Bbm6 | Gm6 C7 (to F).
#   B  F | C/E | Dm | Bb C | Ab | Bb | C | A7, second pass with Dm7, Bbmaj7, Csus4 and A7b9.
#   Solo Dm A/C# | F/C Bdim7 | Gm/Bb A7sus | A7 A7b9. Break B7. A' as A, a whole step up. Coda Em riff, C D Em.
# Instruments (frames): kick (noise 1, pulse A3 sliding to D2 in 4, tri 2, gate off, TEST restart); short kick;
#   snare and low snare (tri, noise, pulse, noise); ghost; closed, open and accent hats; four toms (noise frame, then
#   a stepped falling triangle); bass (pulse, +12 click, 50 % to 15 % duty in 16 frames, low-pass 1.6 kHz to 350 Hz
#   in 10 frames at resonance 11); B bass (saw, filter that opens then closes); break bass (resonant low-pass wah,
#   glides); lead (+12 click, 6 % duty opening to 40 % in 20 frames, then slow breathing; vibrato 0.35 st at 6.2 Hz
#   after 12 frames, fading in over 14); fall (noise click, for bends); sing (noise click, vibrato 0.5 st at
#   5.6 Hz after 18 frames, fading in over 30); grace, two mordents, trill; five bloom leads (the note becomes its chord after 18 frames, voiced below it);
#   hard-sync solo; pluck (vibrato 0.25 st at 7 Hz); counter-line; stab; 23 chord arps at 1, 2 and 3 frames.
# Signature: the blooms at the top of the phrases (bars 9, 13, 14-15, 21, 29, 37, 65, 69, 77, 85), and the lift out
#   of the break (bar 64: B7 stab, silence, pickup; bar 65 in E minor).
# Accepted lint: LEVEL-NOOP for the hats and toms (sustain 0) under the arp voice's level 11; their loudness is set
#   by decay.
sidwave: 1.3
title: Neon Run
mode: PAL
tempo: 136.7
speed: 2
sids:
  - { id: sid1, address: "$D400", model: "8580", filter: { owner: v1, route: [1] } }
kit:
  k: kick
  q: kick_short
  s: snare
  z: snare_low
  j: ghost
  h: hat
  o: hat_open
  x: hat_accent
  t: tom_hi
  u: tom_mid
  v: tom_lo
  y: tom_floor
instruments:
  # --- drums (voice 1 shares them with the bass; each has its own filter step) ---
  kick:
    waveform: pulse
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: A6 }, { wave: pulse, note: A3, slide_to: D2, frames: 4 }, { wave: tri, note: D2, frames: 2 }, { gate: false }]
    filtertable: [{ cutoff: 2.4kHz, resonance: 5, type: lowpass }]
  kick_short:
    waveform: pulse
    adsr: [0, 6, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: G6 }, { wave: pulse, note: G3, slide_to: D2, frames: 2 }]
    filtertable: [{ cutoff: 2.4kHz, resonance: 5, type: lowpass }]
  snare:
    waveform: pulse
    adsr: [0, 7, 0, 0]
    wavetable: [{ wave: tri, note: G3 }, { wave: noise, note: C6, frames: 2 }, { wave: pulse, note: D3 }, { wave: noise, note: A5, frames: 4 }, { gate: false }]
    filtertable: [{ cutoff: 250Hz, resonance: 3, type: highpass }]
  snare_low:
    waveform: pulse
    adsr: [0, 8, 0, 0]
    wavetable: [{ wave: tri, note: E3 }, { wave: noise, note: G5, frames: 2 }, { wave: pulse, note: B2 }, { wave: noise, note: F5, frames: 4 }, { gate: false }]
    filtertable: [{ cutoff: 1.5kHz, resonance: 5, type: bandpass }]
  ghost:
    waveform: noise
    adsr: [0, 4, 0, 0]
    wavetable: [{ wave: noise, note: B5, frames: 2 }, { gate: false }]
    filtertable: [{ cutoff: 1kHz, resonance: 2, type: highpass }]
  hat:
    waveform: noise
    hard_restart: { frames: 0 }
    adsr: [0, 2, 0, 0]
    wavetable: [{ wave: noise, note: G7 }, { gate: false }]
  hat_open:
    waveform: noise
    hard_restart: { frames: 0 }
    adsr: [0, 7, 0, 0]
    wavetable: [{ wave: noise, note: G7 }, { wave: noise, note: F#7 }]
  hat_accent:
    waveform: noise
    hard_restart: { frames: 0 }
    adsr: [0, 4, 0, 0]
    wavetable: [{ wave: noise, note: D7, frames: 2 }, { gate: false }]
  # Toms are kit sounds with absolute pitches: a noise frame, then a triangle falling in steps.
  tom_hi:
    waveform: tri
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: A6 }, { wave: tri, note: D5, frames: 2 }, { note: B4, frames: 2 }, { note: A4, frames: 2 }, { note: F#4 }, { gate: false }]
  tom_mid:
    waveform: tri
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: F6 }, { wave: tri, note: Bb4, frames: 2 }, { note: G4, frames: 2 }, { note: F4, frames: 2 }, { note: D4 }, { gate: false }]
  tom_lo:
    waveform: tri
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: D6 }, { wave: tri, note: G4, frames: 2 }, { note: E4, frames: 2 }, { note: D4, frames: 2 }, { note: B3 }, { gate: false }]
  tom_floor:
    waveform: tri
    adsr: [0, 8, 0, 0]
    hard_restart: { test: true }
    wavetable: [{ wave: noise, note: A5 }, { wave: tri, note: F4, frames: 2 }, { note: D4, frames: 2 }, { note: C4, frames: 2 }, { note: A3 }, { gate: false }]
  # --- bass ---
  bass:
    waveform: pulse
    adsr: [0, 8, 7, 2]
    hard_restart: { test: true }
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse }]
    pulsetable: [{ set: 2048 }, { add: -90, frames: 16 }]
    filtertable: [{ cutoff: 1.6kHz, resonance: 11, type: lowpass }, { add: -20, frames: 10 }]
  bass_b:
    waveform: saw
    adsr: [0, 7, 9, 3]
    hard_restart: { test: true }
    wavetable: [{ wave: pulse, note: "+12" }, { wave: saw }]
    filtertable: [{ cutoff: 300Hz, resonance: 12, type: lowpass }, { add: 26, frames: 5 }, { add: -7, frames: 16 }]
  bass_wah:
    waveform: saw
    adsr: [0, 6, 10, 3]
    hard_restart: { test: true }
    portamento: 5
    wavetable: [{ wave: pulse, note: "+12" }, { wave: saw }]
    filtertable: [{ cutoff: 250Hz, resonance: 12, type: lowpass }, { add: 20, frames: 10 }, { add: -8, frames: 20 }]
  # --- leads (voice 3) ---
  lead:
    waveform: pulse
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 12, fade: 14 }
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  # Falls and bends need a wavetable without pitch steps; the click is a noise frame instead.
  fall:
    waveform: pulse
    adsr: [0, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 12, fade: 14 }
    wavetable: [{ wave: noise }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 900 }, { add: 40, frames: 12 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  sing:
    waveform: pulse
    adsr: [1, 6, 11, 6]
    vibrato: { depth: 0.5, rate: 5.6, delay: 18, fade: 30 }
    wavetable: [{ wave: noise }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 500 }, { add: 45, frames: 28 }, { add: -10, frames: 60 }, { add: 10, frames: 60 }] }
  grace:
    waveform: pulse
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 12, fade: 14 }
    wavetable: [{ wave: pulse, note: "-1", frames: 2 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  mord:
    waveform: pulse
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 12, fade: 14 }
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 2 }, { wave: pulse, note: "+2", frames: 3 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  mordh:
    waveform: pulse
    adsr: [1, 5, 10, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 12, fade: 14 }
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 2 }, { wave: pulse, note: "+1", frames: 3 }, { wave: pulse }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  trill:
    waveform: pulse
    adsr: [1, 5, 11, 5]
    loop: 1
    wavetable: [{ wave: pulse, note: "+12" }, { note: "+0", frames: 3 }, { note: "+1", frames: 3 }]
    pulsetable: { loop: 1, steps: [{ set: 600 }, { add: 20, frames: 60 }, { add: -20, frames: 60 }] }
  # The note sounds for 18 frames with vibrato, then becomes its chord at 1 frame per tone, voiced below it.
  bloom5m:   # the fifth of a minor chord (A over Dm: A F D)
    waveform: pulse
    adsr: [1, 5, 11, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 8, fade: 10 }
    loop: 3
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 25 }, { wave: pulse, note: "+0" }, { note: "+0" }, { note: "-4" }, { note: "-7" }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  bloom1M:   # the root of a major chord (Bb over Dm: Bb F D)
    waveform: pulse
    adsr: [1, 5, 11, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 8, fade: 10 }
    loop: 3
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 17 }, { wave: pulse, note: "+0" }, { note: "+0" }, { note: "-5" }, { note: "-8" }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  bloomM7:   # the major seventh (A over Bbmaj7: A F D Bb)
    waveform: pulse
    adsr: [1, 5, 11, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 8, fade: 10 }
    loop: 3
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 17 }, { wave: pulse, note: "+0" }, { note: "+0" }, { note: "-4" }, { note: "-7" }, { note: "-11" }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  bloom7m:   # the seventh of a minor seventh (C over Dm7: C A F D)
    waveform: pulse
    adsr: [1, 5, 12, 6]
    vibrato: { depth: 0.45, rate: 6.2, delay: 8, fade: 10 }
    loop: 3
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 17 }, { wave: pulse, note: "+0" }, { note: "+0" }, { note: "-3" }, { note: "-7" }, { note: "-10" }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  bloom3M:   # the third of a major chord (C over Ab: C Ab Eb)
    waveform: pulse
    adsr: [1, 5, 11, 5]
    vibrato: { depth: 0.35, rate: 6.2, delay: 8, fade: 10 }
    loop: 3
    wavetable: [{ wave: pulse, note: "+12" }, { wave: pulse, frames: 17 }, { wave: pulse, note: "+0" }, { note: "+0" }, { note: "-4" }, { note: "-9" }]
    pulsetable: { loop: 2, steps: [{ set: 246 }, { add: 70, frames: 20 }, { add: -14, frames: 50 }, { add: 14, frames: 50 }] }
  # Hard sync to voice 2, which the compiler drives silently at the written pitch; each bend sweeps the synced
  # oscillator, so the written pitch stays while the timbre tears upwards.
  sync:
    waveform: saw
    sync: true
    source_note: "+0"
    adsr: [0, 9, 10, 6]
    wavetable: [{ wave: pulse, frames: 2 }, { wave: saw }]
  # --- voice 2 melodic instruments ---
  pluck:
    waveform: pulse
    adsr: [0, 8, 4, 4]
    vibrato: { depth: 0.25, rate: 7, delay: 10 }
    wavetable: [{ wave: saw, note: "+12" }, { wave: pulse }]
    pulsetable: [{ set: 1300 }, { add: -24, frames: 30 }]
  counter:
    waveform: pulse
    adsr: [2, 6, 9, 5]
    vibrato: { depth: 0.3, rate: 5, delay: 16, fade: 24 }
    wavetable: [{ wave: tri, note: "+12" }, { wave: pulse }]
    pulsetable: { reset: false, loop: 1, steps: [{ set: 1800 }, { add: 9, frames: 90 }, { add: -9, frames: 90 }] }
  stab:
    waveform: pulse
    adsr: [0, 7, 8, 1]
    wavetable: [{ wave: noise, note: "+24" }, { wave: saw }]
  # --- chord arpeggios: a 1-frame saw transient two octaves up, then the tones high to low ---
  a1_m64: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12" }, { note: "+8" }, { note: "+5" }, { note: "+0" }] }
  a1_M6: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12" }, { note: "+8" }, { note: "+3" }, { note: "+0" }] }
  a1_M64: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12" }, { note: "+9" }, { note: "+5" }, { note: "+0" }] }
  a1_s7: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+10" }, { note: "+7" }, { note: "+5" }, { note: "+0" }] }
  a1_d7: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+10" }, { note: "+7" }, { note: "+4" }, { note: "+0" }] }
  a1_j7: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+11" }, { note: "+7" }, { note: "+4" }, { note: "+0" }] }
  a1_mm6: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 6, 9, 3], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.12 }, { add: 28, frames: 45 }, { add: -12, frames: 105 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+9" }, { note: "+7" }, { note: "+3" }, { note: "+0" }] }
  a2_M6: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12", frames: 2 }, { note: "+8", frames: 2 }, { note: "+3", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_M64: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12", frames: 2 }, { note: "+9", frames: 2 }, { note: "+5", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_m64: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12", frames: 2 }, { note: "+8", frames: 2 }, { note: "+5", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_d7: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+10", frames: 2 }, { note: "+7", frames: 2 }, { note: "+4", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_m7: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+10", frames: 2 }, { note: "+7", frames: 2 }, { note: "+3", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_j7: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+11", frames: 2 }, { note: "+7", frames: 2 }, { note: "+4", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_s4: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12", frames: 2 }, { note: "+7", frames: 2 }, { note: "+5", frames: 2 }, { note: "+0", frames: 2 }] }
  a2_b9: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [0, 8, 7, 4], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.42 }, { add: -22, frames: 50 }, { add: 10, frames: 110 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+13", frames: 2 }, { note: "+10", frames: 2 }, { note: "+7", frames: 2 }, { note: "+4", frames: 2 }, { note: "+0", frames: 2 }] }
  a3_m64: { hard_restart: { frames: 0 }, waveform: pulse, adsr: [1, 9, 6, 6], pulsetable: { reset: false, loop: 1, steps: [{ set: 0.22 }, { add: 9, frames: 90 }, { add: -8, frames: 101 }] }, loop: 1, wavetable: [{ wave: saw, note: "+24" }, { note: "+12", frames: 3 }, { note: "+8", frames: 3 }, { note: "+5", frames: 3 }, { note: "+0", frames: 3 }] }
