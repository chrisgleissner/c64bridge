          ["C3@lib:kick", "-", "C3@lib:hat", "-", "C3@lib:snare", "-", "C3@lib:hat", "-", "C3@lib:kick", "-", "C3@lib:hat", "-", "C3@lib:snare", "-", "C3@lib:hat", "-", "C3@lib:kick", "C3@lib:kick", "C3@lib:hat", "-", "C3@lib:snare", "-", "C3@lib:hat", "-", "C3@lib:kick", "C3@lib:kick", "C3@lib:hat", "-", "C3@lib:snare", "-", "C3@lib:hat", "-", "C3@lib:kick", "C3@lib:kick", "C3@lib:hat", "-", "C3@lib:snare", "-", "C3@lib:kick", "C3@lib:kick", "C3@lib:hat", "C3@lib:kick", "C3@lib:hat", "-", "C3@lib:snare", "-", "C3@lib:kick", "C3@lib:hat", "C3@lib:kick", "-", "C3@lib:kick", "C3@lib:kick", "C3@lib:snare", "-", "C3@lib:hat", "C3@lib:kick", "-", "C3@lib:kick", "C3@lib:kick", "-", "C3@lib:snare", "-", "C3@lib:kick", "C3@lib:hat"]
