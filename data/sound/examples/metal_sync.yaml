# Progressive metal "Iron Weather" | 7/8 riff, 12/8 bridge, 4/4 solo | E minor to G major to E minor | 1 SID
# Techniques: Palm-muted kick/chug and power-chord transitions share the bass channel; 7/8 grouped 2+2+3, a 12/8 bridge at 125 BPM, twin guitar answers, pinch harmonics, snare fills, and a ramped stop-time coda.
# Learn: The three-note descending riff moves through E minor, turns into a broad bridge, then returns transposed to F# minor before a solo and altered verse. Bar 8 drops into the abrupt 7/8 riff; bar 69's lone call precedes the final cadence.
# Accepted lint: LEVEL-NOOP on sustain-zero drum hits; HR-GAP at the notated stop-time; FILTER-STEP at the abrupt riff entrance; ARP-FAST on the 100 Hz fused chords (calls: 1).
sidwave: 1.3
title: "Iron Weather"
tempo: 167.08
meter: "4/4"
mode: "PAL"
speed: 2
sids:
  - {id: "sid1", address: "$D400", model: "8580", filter: {owner: "v1", route: [1]}}
instruments:
  # ---- voice 1: kick and snare fused with the guitar, each with its own filter step ----
  kc:
    # kick into a palm-muted chug on the written note
    waveform: "pulse"
    adsr: [0, 7, 3, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "A6"}, {wave: "pulse", note: "+19"}]
    pulsetable: [{set: 2048}, {add: -70, frames: 12}]
    filtertable: [{cutoff: "2.2kHz", resonance: 5, type: "lowpass", frames: 3}, {cutoff: "1.2kHz", resonance: 10}, {add: -30, frames: 6}]
  chug:
    # palm mute: octave click, pulse narrowing, resonant low-pass closing in 6 frames
    waveform: "pulse"
    adsr: [0, 5, 4, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 1850}, {add: -60, frames: 10}]
    filtertable: [{cutoff: "1.3kHz", resonance: 11, type: "lowpass"}, {add: -32, frames: 6}]
  pw:
    # open power chord: root, fifth, octave at 1 frame each
    waveform: "saw"
    adsr: [0, 8, 9, 3]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw", note: "+0"}, {note: "+7"}]
    filtertable: {steps: [{cutoff: "2.6kHz", resonance: 9, type: "lowpass"}, {add: -6, frames: 40}]}
    loop: 1
  sp:
    # snare transient snaps into the power-chord root on fast sixteenths
    waveform: "saw"
    adsr: [0, 8, 9, 3]
    wavetable: [{wave: "noise", note: "C6"}, {wave: "saw", note: "+0"}]
    filtertable: {steps: [{cutoff: "700Hz", resonance: 4, type: "highpass", frames: 5}, {cutoff: "2.6kHz", resonance: 9, type: "lowpass"}, {add: -6, frames: 40}]}
    loop: 1
  kpow:
    # kick into a held power chord (half time)
    waveform: "saw"
    adsr: [0, 9, 10, 4]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "A6"}, {wave: "pulse", note: "+19"}, {wave: "pulse", note: "+9"}, {wave: "pulse", note: "+3"}, {wave: "saw", note: "+0"}, {note: "+7"}, {note: "+12"}]
    filtertable: {steps: [{cutoff: "1.8kHz", resonance: 5, type: "lowpass", frames: 4}, {cutoff: "2.8kHz", resonance: 9}, {add: -4, frames: 80}, {add: -1, frames: 20}, {add: -1, frames: 20}]}
    loop: 4
  ktt:
    # kick into the tritone chord (root, diminished fifth, octave)
    waveform: "saw"
    adsr: [0, 9, 10, 4]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "A6"}, {wave: "pulse", note: "+19"}, {wave: "pulse", note: "+9"}, {wave: "pulse", note: "+3"}, {wave: "saw", note: "+0"}, {note: "+6"}, {note: "+12"}]
    filtertable: [{cutoff: "1.6kHz", resonance: 12, type: "lowpass"}, {cutoff: "1.5kHz", resonance: 12}, {cutoff: "1.4kHz", resonance: 11}, {cutoff: "1.3kHz", resonance: 11}, {cutoff: "1.2kHz", resonance: 10}]
    loop: 4
  stt:
    # snare into the tritone chord
    waveform: "saw"
    adsr: [0, 9, 10, 4]
    wavetable: [{wave: "tri", note: "A3"}, {wave: "noise", note: "C6", frames: 2}, {wave: "noise", note: "G5", frames: 2}, {wave: "saw", note: "+0"}, {note: "+6"}, {note: "+12"}]
    filtertable: {steps: [{cutoff: "700Hz", resonance: 4, type: "highpass", frames: 5}, {cutoff: "2.4kHz", resonance: 12, type: "lowpass"}, {add: -1, frames: 30}, {add: -1, frames: 10}]}
    loop: 3
  pwh:
    # ringing power chord with a long release and a slowly closing filter
    waveform: "saw"
    adsr: [0, 10, 11, 11]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw", note: "+0"}, {note: "+7"}]
    filtertable: {steps: [{cutoff: "3kHz", resonance: 10, type: "lowpass"}, {add: -3, frames: 200}]}
    loop: 1
  clean:
    # intro arpeggio: triangle octave pluck, then a slowly drifting pulse through a soft low-pass
    waveform: "pulse"
    pulse_width: 700
    adsr: [0, 9, 3, 8]
    hard_restart: {frames: 0}
    wavetable: [{wave: "tri", note: "+12"}, {wave: "pulse"}]
    pulsetable: {reset: false, loop: 0, steps: [{set: 1000}, {add: 4, frames: 200}, {add: -4, frames: 200}]}
    filtertable: [{cutoff: "2.6kHz", resonance: 7, type: "lowpass"}, {add: -12, frames: 9}]
  kick:
    waveform: "pulse"
    adsr: [0, 7, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "G6"}, {wave: "pulse", note: "G3", slide_to: "E1", frames: 1}]
    filtertable: [{cutoff: "2kHz", resonance: 4, type: "lowpass"}]
  snare:
    waveform: "pulse"
    adsr: [0, 7, 0, 0]
    wavetable: [{wave: "tri", note: "G3"}, {wave: "noise", note: "C6"}]
    filtertable: [{cutoff: "400Hz", resonance: 3, type: "highpass"}]
  snare_low:
    waveform: "pulse"
    adsr: [0, 8, 0, 0]
    wavetable: [{wave: "tri", note: "E3"}, {wave: "noise", note: "G5"}]
    filtertable: [{cutoff: "1.5kHz", resonance: 5, type: "bandpass"}]
  ghost:
    waveform: "noise"
    adsr: [0, 3, 0, 0]
    wavetable: [{wave: "tri", note: "F3"}, {wave: "noise", note: "B5", frames: 2}, {gate: false}]
    filtertable: [{cutoff: "900Hz", resonance: 2, type: "highpass"}]
  # ---- voice 2: cymbals and toms (unfiltered), the twin lead, the clean arpeggio of the bridge and outro ----
  hat:
    waveform: "noise"
    adsr: [0, 2, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "G7"}, {gate: false}]
  hat_open:
    waveform: "noise"
    adsr: [0, 7, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "G7"}, {wave: "noise", note: "F#7"}]
  hat_accent:
    waveform: "noise"
    adsr: [0, 4, 0, 0]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "D7", frames: 2}, {gate: false}]
  crash:
    waveform: "noise"
    adsr: [0, 10, 0, 10]
    wavetable: [{wave: "noise", note: "E7", frames: 3}, {wave: "noise", note: "B6", frames: 5}, {wave: "noise", note: "D7"}]
  swell:
    # reverse cymbal: noise rising in pitch under a slow attack
    waveform: "noise"
    adsr: [12, 0, 15, 1]
    wavetable: [{wave: "noise", note: "C5", frames: 12}, {wave: "noise", note: "F5", frames: 12}, {wave: "noise", note: "A#5", frames: 12}, {wave: "noise", note: "D#6", frames: 12}, {wave: "noise", note: "G#6", frames: 12}, {wave: "noise", note: "D7"}]
  tom_hi:
    waveform: "tri"
    adsr: [0, 8, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "G6"}, {wave: "tri", note: "B4", slide_to: "E4", frames: 1}]
  tom_mid:
    waveform: "tri"
    adsr: [0, 8, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "F6"}, {wave: "tri", note: "G4", slide_to: "C4", frames: 1}]
  tom_lo:
    waveform: "tri"
    adsr: [0, 9, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "D6"}, {wave: "tri", note: "E4", slide_to: "A3", frames: 1}]
  harm:
    # second guitar of the twin lead: noise pick, pulse sweeping from wide to narrow
    waveform: "pulse"
    adsr: [0, 6, 10, 5]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 2700}, {add: -95, frames: 12}, {add: 12, frames: 45}, {add: -12, frames: 45}]}
    vibrato: {depth: 0.3, rate: 6.0, delay: 16, fade: 10}
  clean2:
    # clean arpeggio on voice 2 (no filter): triangle pluck, pulse body
    waveform: "pulse"
    pulse_width: 900
    adsr: [0, 8, 4, 7]
    hard_restart: {frames: 0}
    wavetable: [{wave: "tri", note: "+12"}, {wave: "pulse"}]
    pulsetable: {reset: false, loop: 0, steps: [{set: 1000}, {add: 5, frames: 150}, {add: -5, frames: 150}]}
  thunder:
    # crack, then a low rolling noise
    waveform: "noise"
    adsr: [0, 9, 9, 11]
    # Keep the descending noise sweep's SID clock stages on E-minor chord tones.
    wavetable: [{wave: "noise", note: "G5", frames: 2}, {wave: "noise", note: "E5", frames: 3}, {wave: "noise", note: "B4", frames: 4}, {wave: "noise", note: "G4", frames: 6}, {wave: "noise", note: "E4", frames: 10}, {wave: "noise", note: "B3", frames: 8}, {wave: "noise", note: "G3", frames: 12}, {wave: "noise", note: "E3", frames: 9}]
    loop: 4
  uni:
    waveform: "saw"
    adsr: [0, 8, 11, 10]
    wavetable: [{wave: "pulse", note: "+12"}, {wave: "saw"}]
    vibrato: {depth: 0.25, rate: 5.0, delay: 30, fade: 30}
  # ---- voice 3: leads ----
  lead:
    # noise pick, pulse opening fast from 7 % to 40 %, then breathing; vibrato 0.35 st at 6.4 Hz
    waveform: "pulse"
    adsr: [0, 6, 11, 5]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 110, frames: 12}, {add: -16, frames: 45}, {add: 16, frames: 45}]}
    vibrato: {depth: 0.35, rate: 6.4, delay: 14, fade: 12}
  sing:
    # long notes: saw pick, wider pulse, vibrato 0.55 st at 5.8 Hz fading in after 18 frames
    waveform: "pulse"
    adsr: [0, 5, 12, 6]
    wavetable: [{wave: "saw"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 500}, {add: 60, frames: 20}, {add: -10, frames: 60}, {add: 10, frames: 60}]}
    vibrato: {depth: 0.55, rate: 5.8, delay: 18, fade: 25}
  pinch:
    # pinch harmonic squeal: octave click, narrow pulse, fast wide vibrato
    waveform: "pulse"
    adsr: [0, 7, 8, 4]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: [{set: 250}, {add: 30, frames: 20}]
    vibrato: {depth: 0.5, rate: 7.5, delay: 5, fade: 6}
  grace:
    # a semitone grace note below
    waveform: "pulse"
    adsr: [0, 6, 11, 5]
    wavetable: [{wave: "noise", note: "-1"}, {wave: "pulse", note: "-1"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 110, frames: 12}, {add: -16, frames: 45}, {add: 16, frames: 45}]}
    vibrato: {depth: 0.35, rate: 6.4, delay: 14, fade: 12}
  mord:
    # upper mordent (a whole step)
    waveform: "pulse"
    adsr: [0, 6, 11, 5]
    wavetable: [{wave: "noise"}, {wave: "pulse", frames: 2}, {wave: "pulse", note: "+2", frames: 2}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 110, frames: 12}, {add: -16, frames: 45}, {add: 16, frames: 45}]}
    vibrato: {depth: 0.35, rate: 6.4, delay: 14, fade: 12}
  mordh:
    # upper mordent (a half step)
    waveform: "pulse"
    adsr: [0, 6, 11, 5]
    wavetable: [{wave: "noise"}, {wave: "pulse", frames: 2}, {wave: "pulse", note: "+1", frames: 2}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 300}, {add: 110, frames: 12}, {add: -16, frames: 45}, {add: 16, frames: 45}]}
    vibrato: {depth: 0.35, rate: 6.4, delay: 14, fade: 12}
  trill:
    # whole-step trill, 3 frames per tone
    waveform: "pulse"
    adsr: [0, 6, 11, 5]
    wavetable: [{wave: "noise"}, {wave: "pulse", note: "+0", frames: 3}, {note: "+2", frames: 3}]
    pulsetable: {steps: [{set: 600}, {add: 25, frames: 60}]}
    loop: 1
  scr:
    # hard sync to voice 2, which the compiler drives an octave below: the pitch heard is the source's
    waveform: "saw"
    adsr: [0, 4, 12, 6]
    sync: true
    wavetable: [{wave: "pulse", sync: true}, {wave: "saw", sync: true}]
    pulsetable: [{set: 1200}]
    vibrato: {depth: 0.6, rate: 7.0, delay: 10}
    source_note: "-12"
  # sweep arpeggios at 100 Hz (calls: 1) over an octave and a half, up and down
  swm:
    waveform: "pulse"
    adsr: [0, 6, 10, 4]
    wavetable: [{wave: "noise", note: "+19", calls: 2}, {wave: "pulse", note: "+0", calls: 1}, {note: "+3", calls: 1}, {note: "+7", calls: 1}, {note: "+10", calls: 1}, {note: "+14", calls: 1}, {note: "+19", calls: 1}, {note: "+15", calls: 1}, {note: "+12", calls: 1}, {note: "+7", calls: 1}, {note: "+3", calls: 1}]
    pulsetable: {steps: [{set: 1000}, {add: 30, frames: 40}]}
    loop: 1
  swj:
    waveform: "pulse"
    adsr: [0, 6, 10, 4]
    wavetable: [{wave: "noise", note: "+19", calls: 2}, {wave: "pulse", note: "+0", calls: 1}, {note: "+4", calls: 1}, {note: "+7", calls: 1}, {note: "+11", calls: 1}, {note: "+14", calls: 1}, {note: "+18", calls: 1}, {note: "+16", calls: 1}, {note: "+12", calls: 1}, {note: "+7", calls: 1}, {note: "+4", calls: 1}]
    pulsetable: {steps: [{set: 1000}, {add: 30, frames: 40}]}
    loop: 1
  swd:
    waveform: "pulse"
    adsr: [0, 6, 10, 4]
    wavetable: [{wave: "noise", note: "+19", calls: 2}, {wave: "pulse", note: "+0", calls: 1}, {note: "+4", calls: 1}, {note: "+7", calls: 1}, {note: "+10", calls: 1}, {note: "+12", calls: 1}, {note: "+16", calls: 1}, {note: "+19", calls: 1}, {note: "+16", calls: 1}, {note: "+10", calls: 1}, {note: "+7", calls: 1}]
    pulsetable: {steps: [{set: 1000}, {add: 30, frames: 40}]}
    loop: 1
  swb:
    waveform: "pulse"
    adsr: [0, 6, 10, 4]
    wavetable: [{wave: "noise", note: "+19", calls: 2}, {wave: "pulse", note: "+0", calls: 1}, {note: "+4", calls: 1}, {note: "+7", calls: 1}, {note: "+10", calls: 1}, {note: "+13", calls: 1}, {note: "+16", calls: 1}, {note: "+19", calls: 1}, {note: "+13", calls: 1}, {note: "+10", calls: 1}, {note: "+4", calls: 1}]
    pulsetable: {steps: [{set: 1000}, {add: 30, frames: 40}]}
    loop: 1
  bell:
    # ring-modulated triangle, its source driven an octave above for harmonic sidebands
    waveform: "tri"
    adsr: [0, 10, 0, 9]
    hard_restart: {frames: 0}
    ring: true
    wavetable: [{wave: "tri", ring: true, note: "+12"}, {wave: "tri", ring: true}]
    source_note: "+12"
  bell2:
    # a darker bell: source an octave above for harmonic sidebands
    waveform: "tri"
    adsr: [0, 11, 0, 10]
    hard_restart: {frames: 0}
    ring: true
    wavetable: [{wave: "tri", ring: true, note: "+12"}, {wave: "tri", ring: true}]
    source_note: "+12"
  bellF:
    # the last bell, with harmonic sidebands
    waveform: "tri"
    adsr: [0, 12, 0, 12]
    hard_restart: {frames: 0}
    ring: true
    wavetable: [{wave: "tri", ring: true, note: "+12"}, {wave: "tri", ring: true}]
    source_note: "+12"
  uni3:
    waveform: "pulse"
    adsr: [0, 7, 11, 10]
    wavetable: [{wave: "noise"}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 900}, {add: 20, frames: 60}, {add: -20, frames: 60}]}
    vibrato: {depth: 0.3, rate: 5.2, delay: 25, fade: 30}
kit:
  k: "kick"
  s: "snare"
  n: "snare_low"
  j: "ghost"
  h: "hat"
  o: "hat_open"
  x: "hat_accent"
  z: "crash"
  w: "swell"
  t: "tom_hi"
  u: "tom_mid"
  v: "tom_lo"
voices:
  - id: 1
    name: "Guitar, kick and snare"
    role: "bass"
    instrument: "chug"
    patterns:
      arp: {groove: "E2@clean B2@clean F#3@clean G3@clean B3@clean G3@clean F#3@clean B2@clean E3@clean B2@clean F#3@clean G3@clean D4@clean B3@clean G3@clean F#3@clean | E2@clean B2@clean G3@clean A3@clean B3@clean A3@clean G3@clean B2@clean E3@clean B2@clean G3@clean A3@clean E4@clean B3@clean A3@clean G3@clean | G2@clean D3@clean F#3@clean A3@clean B3@clean A3@clean F#3@clean D3@clean G2@clean D3@clean F#3@clean B3@clean F#4@clean D4@clean B3@clean A3@clean | E2@clean B2@clean F#3@clean B3@clean E4@clean B3@clean F#3@clean B2@clean E2@clean B2@clean G3@clean B3@clean G4@clean E4@clean B3@clean G3@clean | F2@clean C3@clean E3@clean A3@clean B3@clean A3@clean E3@clean C3@clean F2@clean C3@clean E3@clean B3@clean A4@clean E4@clean B3@clean A3@clean | E2@clean B2@clean F#3@clean G3@clean B3@clean G3@clean F#3@clean B2@clean E2@clean B2@clean G3@clean B3@clean G4@clean F#4@clean E4@clean B3@clean | D2@clean A2@clean E3@clean F#3@clean A3@clean F#3@clean E3@clean A2@clean D2@clean A2@clean E3@clean A3@clean F#4@clean E4@clean D4@clean A3@clean", length: 0.25, bars: 7}
      omen: {groove: "E2@kc ~ E2 ~ G2@pw ~ E2 ~ F2@sp ~ E2 ~ D2@pw ~", length: 0.25, bars: 1}
      rA: {groove: "E2@kc - E2 E2 G2@pw ~ E2 E2 F2@sp ~ E2 E2 D2@pw ~", length: 0.25, bars: 1}
      rA2: {groove: "E2@kc - E2 E2 G2@pw ~ E2 E2 F2@sp ~ E2 E2 Bb1@pw ~", length: 0.25, bars: 1}
      rB: {groove: "E2@kc E2 E2 E2 G2@pw ~ E2@kc E2 F2@sp ~ E2 E2 D3@pw D2@pw", length: 0.25, bars: 1}
      rC: {groove: "E2@kc E2 E2 E2 G2@sp ~ E2@kc E2 F2@sp ~ E2@kc E2 D2@sp ~", length: 0.25, bars: 1}
      rT: {groove: "E2@kc - E2 E2 G2@pw ~ A2@pw ~ Bb2@sp ~ A2@pw G2@pw F2@pw ~", length: 0.25, bars: 1}
      rF: {groove: "E2@kc E2@kc E2 E2@kc G2@sp ~ E2@kc E2 F2@sp ~ k k s s", length: 0.25, bars: 1}
