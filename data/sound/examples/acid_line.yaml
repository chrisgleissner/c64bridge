# Acid | 125.31 BPM | A Phrygian, pedal moves to D Aeolian and back | 1 SID
# Techniques: Three acid voicings of one saw line (plain, accent with a higher and longer filter envelope, slide
#   start whose envelope runs on through the slurred glide) plus band-pass and scream variants, all on the filter
#   owner; a 16-step line that rotates one sixteenth every four bars with one note substituted each time; a
#   3-sixteenth cell against 4/4 under resonance 15 and an 8-bar cutoff climb; a 12-step pulse line on voice 3
#   against the 16-step line through the same filter; one-frame chord stabs (m7, maj7, m7b5, 7sus4, dom7) that
#   move from the filtered voice 3 to the dry drum voice; a kick tuned to A with a TEST restart, closed, open and
#   accent hats, 32nd hat rolls on soft re-gates; play-once ending that removes one note per bar.
# Learn: Nothing is added for its own sake: the line mutates by rotation, the filter type, resonance and section
#   cutoff ramps carry the form, the 3:4 cell breaks the groove, and the 12:16 pair rebuilds it on a new pedal.
# Form (bar = 1.915 s):
#   Intro     1-8   0:00-0:15  kick and the motif through a band-pass (bars 1-4), then a closed low-pass
#                              (the filter type changes) with off-beat open hats (bars 5-8)
#   Line      9-20  0:15-0:38  low-pass opens; accents move every 4 bars (steps 3/10/16, 1/6/13, 4/9/12/16);
#                              stabs on v3 through the acid filter: Am7 Gm7 Bbmaj7
#   Mutation 21-36  0:38-1:09  line rotated one 16th every 4 bars, one note substituted each time (F2, G1,
#                              Bb2, C3); bars 21-24 without stabs, then Dm7 Fmaj7 Em7b5 G7sus4 C7sus4;
#                              harmonic rhythm doubles in bar 36
#   Break    37-44  1:09-1:24  no kick; the line shrinks to the cell A1 A2! Bb1 (3 sixteenths against 4/4),
#                              resonance 15, cutoff rising for 8 bars; bars 37-38 the cell alone
#   Surprise    44  1:22       the cell and a ghost-snare roll stop dead on beat 4: one beat of silence
#   Drop     45-60  1:24-1:55  pedal moves to D (Aeolian); v3 second line in 12 steps against 16; stabs
#                              move to the dry drum voice: Dm7 Bbmaj7 C7sus4, E7 (G#) turns back to A
#   Peak     61-68  1:55-2:10  climax: back on A, both lines in octaves, filter wide open, 32nd hat rolls;
#                              the single Eb (bar 68) is the only note outside the mode
#   Outro    69-80  2:10-2:33  one line note removed per bar, hats and stabs thin out, bar 79 the kick
#                              alone, bar 80 one final hit (kick, accent A1, Am7)
# Motif (16 steps, scale degrees of A Phrygian, 1 = A1, 8 = A2): 1 1 8! 1 | - b3 (1 b2) 1 | b7! 1 1 (5 4) | - 8!
#   characteristic interval: the octave accent against the b2 slide.
# Signature: bars 37-44, the 3:4 cell under the climbing resonant filter (cutoff offset -70 to +700), the
#   silent beat, then two interlocked lines (12 against 16) on the new pedal.
# Harmony: pedal A with Bb and G neighbours; chords Am7 Gm7 Bbmaj7 Dm7 Fmaj7 Em7b5 G7sus4 C7sus4; Drop on D
#   (Dm7 Bbmaj7 C7sus4) with E7 as the outside dominant back to A; one Eb in the Peak.
# Accepted lint: HR-GAP where the kick and an unslurred line note restart together on four beats in a row; the
#   two-frame gap before each kick is the pump of the style, and the next attack follows at once.
sidwave: 1.3
title: "Pressure Glass"
tempo: 125.31
mode: "PAL"
sids:
  - {id: "sid1", address: "$D400", model: "8580", filter: {owner: "v1", route: [1, 3]}}
instruments:
  # The acid voice: one pulse frame as the pluck, then a saw through a resonant low-pass snapping shut.
  acid:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 6, 9, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "1.5kHz", resonance: 12, type: "lowpass"}, {add: -17, frames: 11}]
  # Accent: louder, brighter and a longer filter decay.
  ac:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 7, 11, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "3.0kHz", resonance: 14, type: "lowpass"}, {add: -40, frames: 6}, {add: -7, frames: 24}]
  # Slide start: the envelope keeps falling slowly through the slurred, gliding note that follows.
  sl:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 8, 10, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "2.2kHz", resonance: 13, type: "lowpass"}, {add: -7, frames: 36}]
  # Octave flick: two frames an octave up before the note settles, on structural accents.
  fl:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 7, 11, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse", note: "+12", frames: 2}, {wave: "saw"}]
    filtertable: [{cutoff: "3.6kHz", resonance: 14, type: "lowpass"}, {add: -50, frames: 6}, {add: -6, frames: 24}]
  # Intro colour: the same line through a band-pass.
  bp:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 6, 9, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "900Hz", resonance: 14, type: "bandpass"}, {add: -6, frames: 10}]
  bpa:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 7, 11, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "1.8kHz", resonance: 14, type: "bandpass"}, {add: -8, frames: 20}]
  # Break cell: the envelope opens upwards, so each note screams into the next.
  sc:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 5, 10, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "600Hz", resonance: 15, type: "bandpass"}, {add: 24, frames: 8}]
  sca:
    waveform: "saw"
    pulse_width: 2048
    adsr: [0, 6, 12, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "pulse"}, {wave: "saw"}]
    filtertable: [{cutoff: "1.2kHz", resonance: 15, type: "bandpass"}, {add: 30, frames: 6}, {add: -18, frames: 10}]
  # Second line on voice 3: a hollow pulse that narrows on each phrase and breathes, through the owner's filter.
  line2:
    waveform: "pulse"
    adsr: [0, 6, 8, 2]
    wavetable: [{note: "+12"}, {wave: "pulse"}]
    pulsetable: {reset: false, loop: 2, steps: [{set: 2048}, {add: -48, frames: 18}, {add: 9, frames: 44}, {add: -9, frames: 44}]}
  l2a:
    waveform: "pulse"
    adsr: [0, 7, 11, 2]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 0.5}, {add: -60, frames: 14}]
  kick:
    waveform: "tri"
    pulse_width: 1200
    adsr: [0, 8, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "E6"}, {wave: "pulse", note: "E3", slide_to: "A1", frames: 5}, {wave: "tri", note: "A1", frames: 3}, {gate: false}]
  hat:
    waveform: "noise"
    adsr: [0, 3, 0, 3]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "G7"}, {gate: false}]
  ohat:
    waveform: "noise"
    adsr: [0, 7, 0, 6]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "A7", frames: 2}, {note: "F#7"}]
  ahat:
    waveform: "noise"
    adsr: [0, 5, 0, 4]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "D7"}, {gate: false}]
  snare:
    waveform: "noise"
    pulse_width: 2048
    adsr: [0, 7, 0, 0]
    wavetable: [{wave: "tri", note: "E3"}, {wave: "noise", note: "C6", frames: 2}, {wave: "pulse", note: "C#3"}, {wave: "noise", note: "G#5"}, {gate: false}]
  # Roll stroke: a short noise burst that re-gates softly, for 32nd and 16th rolls.
  roll:
    waveform: "noise"
    adsr: [0, 4, 0, 3]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "D6"}, {note: "A5"}, {gate: false}]
  ghost:
    waveform: "noise"
    adsr: [0, 3, 0, 2]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "B5", frames: 2}, {gate: false}]
  # One-frame chord stabs, top tone first so the root lands last; one noise frame as the hit.
  m7:
    waveform: "pulse"
    adsr: [0, 7, 0, 4]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+10"}, {note: "+7"}, {note: "+3"}, {note: "+0"}]
    pulsetable: [{set: 0.3}, {add: 40, frames: 12}]
    loop: 1
  maj7:
    waveform: "pulse"
    adsr: [0, 7, 0, 4]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+11"}, {note: "+7"}, {note: "+4"}, {note: "+0"}]
    pulsetable: [{set: 0.3}, {add: 40, frames: 12}]
    loop: 1
  m7b5:
    waveform: "pulse"
    adsr: [0, 7, 0, 4]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+10"}, {note: "+6"}, {note: "+3"}, {note: "+0"}]
    pulsetable: [{set: 0.3}, {add: 40, frames: 12}]
    loop: 1
  sus:
    waveform: "pulse"
    adsr: [0, 7, 0, 4]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+10"}, {note: "+7"}, {note: "+5"}, {note: "+0"}]
    pulsetable: [{set: 0.3}, {add: 40, frames: 12}]
    loop: 1
  d7:
    waveform: "pulse"
    adsr: [0, 8, 0, 5]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+10"}, {note: "+7"}, {note: "+4"}, {note: "+0"}]
    pulsetable: [{set: 0.3}, {add: 40, frames: 12}]
    loop: 1
  # Two frames per tone: the warbling game chord, used dry on voice 2 in the Drop.
  m7w:
    waveform: "pulse"
    adsr: [0, 7, 0, 5]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+10", frames: 2}, {note: "+7", frames: 2}, {note: "+3", frames: 2}, {note: "+0", frames: 2}]
    pulsetable: [{set: 0.45}, {add: -30, frames: 20}]
    loop: 1
  maj7w:
    waveform: "pulse"
    adsr: [0, 7, 0, 5]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+11", frames: 2}, {note: "+7", frames: 2}, {note: "+4", frames: 2}, {note: "+0", frames: 2}]
    pulsetable: [{set: 0.45}, {add: -30, frames: 20}]
    loop: 1
  susw:
    waveform: "pulse"
    adsr: [0, 7, 0, 5]
    wavetable: [{wave: "noise", note: "+36"}, {wave: "pulse", note: "+10", frames: 2}, {note: "+7", frames: 2}, {note: "+5", frames: 2}, {note: "+0", frames: 2}]
    pulsetable: [{set: 0.45}, {add: -30, frames: 20}]
    loop: 1
kit:
  k: "kick"
  h: "hat"
  o: "ohat"
  x: "ahat"
  s: "snare"
  q: "ghost"
  r: "roll"
voices:
  - id: 1
    name: "Acid line"
    role: "bass"
    instrument: "acid"
    patterns:
      # Intro: the motif through the band-pass.
      bp0: {groove: "A1@bp A1@bp A2!@bpa A1@bp - C2@bp (A1@bp /Bb1) A1@bp G2!@bpa A1@bp A1@bp (E2@bp /D2) - A2!@bpa", length: 0.25, bars: 1}
      bp1: {groove: "A1@bp A1@bp A2!@bpa A1@bp - C2@bp (A1@bp /Bb1) A1@bp G2!@bpa A1@bp A1@bp (E2@bp /G2) A2!@bpa C3!@bpa", length: 0.25, bars: 1}
      # Line: the accents move every four bars; bar 4 of each group turns the phrase.
      l0: {groove: "A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 A1 (E2@sl /D2) - A2!@ac", length: 0.25, bars: 1}
      l0t: {groove: "A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 A1 (E2@sl /G2) A2!@ac C3!@ac", length: 0.25, bars: 1}
      l1: {groove: "A1!@ac A1 A2 A1 - C2!@ac (A1@sl /Bb1) A1 G2 A1 A1 (E2!@ac /D2) - A2!@fl", length: 0.25, bars: 1}
      l1t: {groove: "A1!@ac A1 A2 A1 - C2!@ac (A1@sl /Bb1) A1 G2 (A1@sl /C3) (E2!@ac /D2) Bb1 A2!@fl", length: 0.25, bars: 1}
      l2: {groove: "A1 A1 A2 A1!@ac - C2 (A1@sl /Bb1) A1!@ac G2 A1 A1!@ac (E2@sl /D2) - A2!@ac", length: 0.25, bars: 1}
      l2t: {groove: "A1 A1 A2 A1!@ac - C2 (A1@sl /Bb1) A1!@ac G2 A1 A1!@ac (E2@sl /F2 /E2) D2!@fl", length: 0.25, bars: 1}
      # Mutation: each pattern is the previous one rotated right by one sixteenth with one note substituted.
      m1: {groove: "A2!@ac A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 F2 (E2@sl /D2) -", length: 0.25, bars: 1}
      m2: {groove: "- A2!@ac A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac G1 F2 (E2@sl /D2)", length: 0.25, bars: 1}
      m3: {groove: "D2 - A2!@ac A1 A1 A2!@ac Bb2!@ac - C2 (A1@sl /Bb1) A1 G2!@ac G1 F2 E2", length: 0.25, bars: 1}
      m4: {groove: "(E2@sl /D2) - A2!@ac C3 A1 A2!@ac Bb2!@ac - C2 (A1@sl /Bb1) A1 G2!@ac G1 F2", length: 0.25, bars: 1}
      m4t: {groove: "(E2@sl /D2) - A2!@ac C3 A1 A2!@ac Bb2!@fl - C2 (A1@sl /Bb1) (C3!@ac /Bb2 /G2 /E2)", length: 0.25, bars: 1}
      # Break: three sixteenths against four.
      cell: {groove: "A1@sc A2!@sca Bb1@sc", length: 0.25}
      gap: {groove: "A2!@sca Bb1@sc A1@sc A2!@sca Bb1@sc A1@sc A2!@sca Bb1@sc A1@sc A2!@sca Bb1@sc C3!@sca - - - -", length: 0.25, bars: 1}
      # Drop: pedal D, Aeolian; the b2 slide becomes a fall to C.
      d1: {groove: "D2 D2 D3!@ac D2 - F2 (D2@sl /C2) D2 C3!@ac D2 D2 (A2@sl /G2) - D3!@ac", length: 0.25, bars: 1}
      d2: {groove: "D2 - D3!@ac D2 (F2@sl /G2) - D2 C3!@ac D2 - (A2@sl /G2) F2 - D3!@ac", length: 0.25, bars: 1}
      d3: {groove: "D2 D2 Bb2!@ac D2 - F2 (D2@sl /C2) D2 C3!@ac D2 E2 (A2@sl /G2) - D3!@ac", length: 0.25, bars: 1}
      dt: {groove: "D2 D2 D3!@ac D2 - F2 (D2@sl /C2) D2 C3!@ac (A2@sl /G2) F2 C2 (A1@sl /C2)", length: 0.25, bars: 1}
      d4: {groove: "D2 D2 D3!@ac D2 - F2 (D2@sl /C2) E2!@ac E2 E3!@fl E2 (G#2@sl /A2) G#2 E2!@ac", length: 0.25, bars: 1}
      # Peak: back on A; p2 carries the only Eb.
      p1: {groove: "A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 C3!@ac (E2@sl /D2) - A2!@ac", length: 0.25, bars: 1}
      p3: {groove: "A1 A2!@fl A1 A2!@ac C2 A1 (Bb1@sl /A1) G2!@ac A1 A1 C3!@ac (E2@sl /D2) - A2!@ac", length: 0.25, bars: 1}
      p2: {groove: "A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 C3!@ac (Eb3!@ac /D3) C3 A2!@ac", length: 0.25, bars: 1}
      # Outro: one note removed per bar.
      o1: {groove: "A1 A1 A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 - (E2@sl /D2) - A2!@ac", length: 0.25, bars: 1}
      o2: {groove: "A1 - A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 - (E2@sl /D2) - A2!@ac", length: 0.25, bars: 1}
      o3: {groove: "A1 - A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac A1 - E2 - - A2!@ac", length: 0.25, bars: 1}
      o4: {groove: "A1 - A2!@ac A1 - C2 (A1@sl /Bb1) A1 G2!@ac - - E2 - - A2!@ac", length: 0.25, bars: 1}
      o5: {groove: "A1 - A2!@ac A1 - C2 A1 - A1 G2!@ac - - E2 - - A2!@ac", length: 0.25, bars: 1}
      o6: {groove: "A1 - A2!@ac A1 - - A1 - A1 G2!@ac - - E2 - - A2!@ac", length: 0.25, bars: 1}
      o7: {groove: "A1 - A2!@ac - - - A1 - A1 G2!@ac - - E2 - - A2!@ac", length: 0.25, bars: 1}
      o8: {groove: "A1 - A2!@ac - - - A1 - A1 G2!@ac - - - - - A2!@ac", length: 0.25, bars: 1}
      o9: {groove: "A1 - A2!@ac - - - A1 - A1 - - - - - - A2!@ac", length: 0.25, bars: 1}
      o10: {groove: "A1 - A2!@ac - - - A1 - A1 - - - - - - -", length: 0.25, bars: 1}
      hit: {groove: "A1!@ac - - -", length: 1, bars: 1}
  - id: 2
    name: "Kick, hats and dry stabs"
    role: "drums"
    patterns:
      k0: {groove: "k - - - k - - - k - - - k - - -", length: 0.25, bars: 1}
      k1: {groove: "k - - - k - - - k - - - k - h h", length: 0.25, bars: 1}
      k2: {groove: "k - o - k - o - k - o - k - o -", length: 0.25, bars: 1}
      k3: {groove: "k - o - k - o - k - o h k q s q", length: 0.25, bars: 1}
      a1: {groove: "k - o h k - o - k - o h k - o -", length: 0.25, bars: 1}
      a2: {groove: "k - o - k - o h k - o - k - o x", length: 0.25, bars: 1}
      a3: {groove: "k - o h k h o - k - o h k h o x", length: 0.25, bars: 1}
      f1: {groove: "k - o h k - o - k - o h k q s r", length: 0.25, bars: 1}
      f2: {groove: "k - o - k - s - k - s q s q s r", length: 0.25, bars: 1}
      # Break: off-beat open hats, then accents every three sixteenths, then a ghost-snare roll that stops dead.
      b1: {groove: "- - o - - - o - - - o - - - o -", length: 0.25, bars: 1}
      b2: {groove: "x h h x h h x h h x h h x h h x", length: 0.25, bars: 1}
      b3: {groove: "h h x h h x h h x h h x h h x h", length: 0.25, bars: 1}
      b4: {groove: "s - - - q - q - s - - - q - q - s - q - s - q - s - q q s q q q", length: 0.125, bars: 1}
      bgap: {groove: "s - q - s q q - s - q q s q q q s q s q s q s q - - - - - - - -", length: 0.125, bars: 1}
      # Drop: dry stabs between the kicks.
      e1: {groove: "k - o - k - D4@m7w - k - o - k - o h", length: 0.25, bars: 1}
      e2: {groove: "k - o - k - o - k - Bb3@maj7w - k - o -", length: 0.25, bars: 1}
      e3: {groove: "k - o h k - C4@susw - k - o - k - o x", length: 0.25, bars: 1}
      e4: {groove: "k - o - k - Bb3@maj7w - k - C4@susw - k q s r", length: 0.25, bars: 1}
      e5: {groove: "k - o - k - E3@d7 - k - E3@d7 - k s r r", length: 0.25, bars: 1}
      # Peak: 32nd hat rolls.
      r1: {groove: "k - - - o - - - k - - - o - - - k - - - o - - - k - - h h h h h", length: 0.125, bars: 1}
      r2: {groove: "k - - - o - h h k - - - o - - - k - - - o - h h k - - h h h h h", length: 0.125, bars: 1}
      r3: {groove: "k - - - o - h h k - - - o - h h k - - - o - h h k - - q q r r r", length: 0.125, bars: 1}
      # Outro: hats removed, then the kick alone.
      t1: {groove: "k - o - k - o - k - o - k - - -", length: 0.25, bars: 1}
      t2: {groove: "k - o - k - - - k - o - k - - -", length: 0.25, bars: 1}
      t3: {groove: "k - - - k - - - k - o - k - - -", length: 0.25, bars: 1}
      last: {groove: "k - - -", length: 1, bars: 1}
  - id: 3
    name: "Stabs, second line"
    instrument: "line2"
    patterns:
      s1: {groove: "- - - A3@m7 - - - - - - A3@m7 - - - - - | - - - A3@m7 - - - - - - - - G3@m7 - - - | - - - A3@m7 - - - - - - A3@m7 - - - - - | - - - Bb3@maj7 - - - - - - - - - - G3@m7 -", length: 0.25, bars: 4}
      s1b: {groove: "- - - A3@m7 - - - - - - A3@m7 - - - G3@m7 - | - - - A3@m7 - - - - - - Bb3@maj7 - - - - - | - - - A3@m7 - - - - - - A3@m7 - - - - - | - - G3@m7 - - - Bb3@maj7 - - - - - G3@m7 - - -", length: 0.25, bars: 4}
      s2: {groove: "- - - A3@m7 - - - - - - D4@m7 - - - - - | - - - Bb3@maj7 - - - - - - - - G3@m7 - - - | - - - A3@m7 - - - - - - F3@maj7 - - - - - | - - - E3@m7b5 - - - - - G3@sus - - - - - -", length: 0.25, bars: 4}
      s3: {groove: "- - - A3@m7 - - D4@m7 - - - A3@m7 - - - - - | - - - Bb3@maj7 - - - - - - C4@sus - - - - - | - - - D4@m7 - - - - - - Bb3@maj7 - - - - - | - - G3@m7 - - F3@maj7 - - E3@m7b5 - - - Bb3@maj7 - - -", length: 0.25, bars: 4}
      # Drop: twelve steps against sixteen.
      x1: {groove: "D3 - A3!@l2a (F3 /E3) - D3 C4!@l2a - (Bb3 /A3) -", length: 0.25}
      x2: {groove: "D3 - D4!@l2a (C4 /A3) - F3 G4!@l2a - (F4 /E4) D4", length: 0.25}
      # Peak: the line an octave above voice 1.
      q1: {groove: "A2 A2 A3!@l2a A2 - C3 (A2 /Bb2) A2 G3!@l2a A2 C4!@l2a (E3 /D3) - A3!@l2a", length: 0.25, bars: 1}
      q3: {groove: "A2 A3!@l2a A2 A3!@l2a C3 A2 (Bb2 /A2) G3!@l2a A2 A2 C4!@l2a (E3 /D3) - A3!@l2a", length: 0.25, bars: 1}
      q2: {groove: "A2 A2 A3!@l2a A2 - C3 (A2 /Bb2) A2 G3!@l2a A2 C4!@l2a (D4 /C4) - A3!@l2a", length: 0.25, bars: 1}
      # Outro: the stabs thin out.
      u1: {groove: "- - - A3@m7 - - - - - - A3@m7 - - - - - | - - - A3@m7 - - - - - - - - G3@m7 - - - | - - - A3@m7 - - - - - - - - - - - - | - - - - - - - - - - G3@m7 - - - - -", length: 0.25, bars: 4}
      fin: {groove: "A3@m7 - - -", length: 1, bars: 1}
