# Acid house | 128 BPM | D minor | 1 SID
# Techniques: Per-note resonant low-pass filter tables, resonance accents, bends and four-on-the-floor kick.
# Learn: Keep the groove steady while D minor opens to Bb and G minor, then sharpen the A pedal
sidwave: 1.2
title: Pressure Glass
tempo: 128
mode: PAL
instruments:
  core: {"waveform": "saw", "adsr": [0, 5, 9, 3], "filtertable": [{"cutoff": 1380, "resonance": 7, "type": "lowpass"}, {"add": -69, "frames": 12}]}
  spark: {"waveform": "saw", "adsr": [0, 4, 12, 3], "filtertable": [{"cutoff": 1950, "resonance": 12, "type": "lowpass"}, {"add": -85, "frames": 16}]}
  reed: {"waveform": "triangle", "adsr": [3, 2, 4, 5]}
