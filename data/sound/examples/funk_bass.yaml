# Jazz-funk | 115.67 BPM | E Dorian (solo in G Dorian) | 1 SID
# Techniques: Speed 2 and 16th swing 0.56; a slap bass with five articulations (thumb slap with a saw click, popped octave through a noise flick, dead ghost, hammer-on grace, band-pass solo pop) whose pulse width and resonant low-pass close on every note, sharing voice 1 with a kick and three snares that carry their own filter tables; rootless four-tone e-piano voicings as 100 Hz wavetable chords behind a two-octave tine frame, one frame per tone in the solo, broken into single tines in the bridge, and interleaved with three noise hats on voice 2; a clav that becomes the lead on voice 3; three lead colours (copper pulse, reed with noise attack, glass triangle) with scoops, blue-note bends, mordents, trills, fall-offs and one 32nd run.
# Learn: The motif (pickups 5 b7 into 1, rest, b3 2 1 b7 tied; then b5 sliding to 5, 4 b3 1 and two beats left for the bass) is stated by the copper lead in the head, augmented on the glass lead in the half-time bridge, broken into a three-note cell displaced by five sixteenths in the tag, and recapitulated before the final E13#11. The solo transposes the head harmony up a minor third and alternates two bars of lead with two bars of bass; F13 (the tritone substitute for B7) brings it back to E.
# Form (bar = 2.07 s): bass alone 1-4 (0:00) | groove 5-12 (0:08) | head 13-20 (0:25) | head with answering stabs 21-28 (0:41) | half-time bridge 29-36 (0:58) | solo, G Dorian, lead and bass trading two bars 37-44 (1:15) | solo peak 45-52 (1:31) | stop time 53-56 (1:48) | last head 57-64 (1:56) | tag 65-76 (2:13), turnaround three times, held E13#11 under a two-octave bass gliss, 2:38.
# Harmony: head Em9 A13 | Cmaj7 B7#9 | Em9 A13 | Gmaj9 C#m7b5 F#7b9 | Bm11 Bb13 | Am9 D13 | Cmaj7 C#m7b5 | D13 B7#9/D# (bass C C# D D# E chromatic); bridge Am9 | D13 | Gmaj9 | C#m7b5 F#7b9 | Bm11 over a B pedal (2 bars) | Ebmaj7 | D7#9; solo Gm9 C13 | Ebmaj7 D7#9 | Cm9 F13 | Bbmaj7 Am7b5 D7#9 ... F13; tag Em9 A13 | Cmaj7 B7#9 | G13 C9 | F#7#9 B7b9, ending E13#11.
# Signature: bars 1-4, the slap bass alone; bar 53, unison off-beat hits of bass, e-piano and lead.
# Surprise: bar 56, three beats of silence and a falling 32nd run on the lead alone into the last head.
# Phrases: head 2+2+4 bars; the bridge melody is 3 + 5 bars; the tag cell repeats every five sixteenths against the bar.
# Accepted lint: TABLE-CUT where a bass sixteenth cuts the kick or snare tail on the shared voice (the interleave is the
# point); LEVEL-NOOP for the sustain-0 hats, whose dynamics come from chip volume; ARP-FAST for the e-piano chords at one
# call (10 ms) per tone, which fuse into one chord with a buzz at speed 2.
sidwave: 1.3
title: "Copper Steps"
tempo: 115.67
mode: "PAL"
speed: 2
sids:
  - {id: "sid1", address: "$D400", model: "8580", filter: {owner: "v1", route: [1]}}
instruments:
  # --- voice 1: bass articulations ---
  # Thumb slap: one saw frame an octave up as the string click; pulse closes from 50 % to 15 % and the
  # resonant low-pass from 1.6 kHz to about 470 Hz in 10 frames.
  sl:
    waveform: "pulse"
    adsr: [0, 8, 9, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 2048}, {add: -90, frames: 16}]
    filtertable: [{cutoff: "1.6kHz", resonance: 11, type: "lowpass"}, {add: -18, frames: 10}]
  # Popped string: a noise flick three octaves up, two saw frames, then a narrowing pulse; brighter filter.
  pp:
    waveform: "pulse"
    adsr: [0, 9, 7, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "+36"}, {wave: "saw"}, {wave: "pulse"}]
    pulsetable: [{set: 1600}, {add: -60, frames: 12}]
    filtertable: [{cutoff: "3kHz", resonance: 13, type: "lowpass"}, {add: -25, frames: 12}]
  # Dead note: noise thump and two muffled pulse frames, no pitch body.
  gh:
    waveform: "pulse"
    pulse_width: 1024
    adsr: [0, 4, 0, 0]
    wavetable: [{wave: "noise", note: "+24"}, {wave: "pulse", frames: 1}, {gate: false}]
    filtertable: [{cutoff: "600Hz", resonance: 6, type: "lowpass"}]
  # Hammer-on: two saw frames a whole tone below, then the slap body.
  hm:
    waveform: "pulse"
    adsr: [0, 8, 9, 1]
    hard_restart: {test: true}
    wavetable: [{wave: "saw", note: "-2", frames: 2}, {wave: "pulse"}]
    pulsetable: [{set: 1800}, {add: -70, frames: 16}]
    filtertable: [{cutoff: "1.2kHz", resonance: 12, type: "lowpass"}, {add: -14, frames: 12}]
  # Solo pop: a high-resonance low-pass that snaps down and then keeps closing slowly, for the bass's solo bars.
  sp:
    waveform: "pulse"
    adsr: [0, 7, 11, 2]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "+31"}, {wave: "saw", frames: 2}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 900}, {add: 30, frames: 20}, {add: -30, frames: 20}]}
    filtertable: [{cutoff: "2.2kHz", resonance: 14, type: "lowpass"}, {add: -30, frames: 6}, {add: -4, frames: 30}]
  # Final note: the slap with long release and a slow filter close under the two-octave bend.
  gls:
    waveform: "pulse"
    adsr: [0, 10, 10, 10]
    hard_restart: {test: true}
    wavetable: [{wave: "saw", frames: 2}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 2048}, {add: -20, frames: 50}, {add: 20, frames: 50}]}
    filtertable: [{cutoff: "1.6kHz", resonance: 12, type: "lowpass"}, {add: -4, frames: 60}]
  # --- kit (kick and snares on voice 1, each with its own filter step; hats on voice 2) ---
  kk:
    waveform: "pulse"
    adsr: [0, 8, 0, 0]
    hard_restart: {test: true}
    wavetable: [{wave: "noise", note: "A6"}, {wave: "pulse", note: "A3", slide_to: "E1", frames: 4}, {wave: "tri", note: "E1"}, {gate: false}]
    filtertable: [{cutoff: "2.4kHz", resonance: 4, type: "lowpass"}]
  sn:
    waveform: "pulse"
    adsr: [0, 8, 0, 0]
    wavetable: [{wave: "tri", note: "G#3"}, {wave: "noise", note: "D6", frames: 2}, {wave: "pulse", note: "E3"}, {wave: "noise", note: "B5", frames: 4}, {wave: "noise", note: "G5", frames: 3}, {gate: false}]
    filtertable: [{cutoff: "2kHz", resonance: 9, type: "bandpass"}]
  sq:
    waveform: "pulse"
    adsr: [0, 9, 0, 0]
    wavetable: [{wave: "tri", note: "E3"}, {wave: "noise", note: "A5", frames: 2}, {wave: "pulse", note: "B2"}, {wave: "noise", note: "F5", frames: 5}, {wave: "noise", note: "D5", frames: 3}, {gate: false}]
    filtertable: [{cutoff: "1.2kHz", resonance: 10, type: "bandpass"}]
  sz:
    waveform: "noise"
    adsr: [0, 3, 0, 0]
    wavetable: [{wave: "noise", note: "C6", frames: 3}, {gate: false}]
    filtertable: [{cutoff: "2.5kHz", resonance: 6, type: "bandpass"}]
  hc: {waveform: "noise", adsr: [0, 2, 0, 0], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "G7"}, {gate: false}]}
  ho: {waveform: "noise", adsr: [0, 7, 0, 0], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "G7", frames: 2}, {wave: "noise", note: "F7"}]}
  hx: {waveform: "noise", adsr: [0, 5, 0, 3], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "D7", frames: 2}, {gate: false}]}
  # --- voice 2: e-piano. Rootless four-tone voicings, high to low so the lowest tone lands last; a
  # triangle tine two octaves up starts each chord; 1 call (10 ms) per tone at speed 2.
  ma:
    waveform: "pulse"
    adsr: [0, 9, 4, 5]
    hard_restart: {frames: 0}
    wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+11", calls: 1}, {note: "+7", calls: 1}, {note: "+4", calls: 1}, {note: "+0", calls: 1}]
    pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}
    loop: 1
  mi: {waveform: "pulse", adsr: [0, 9, 4, 5], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+10", calls: 1}, {note: "+7", calls: 1}, {note: "+3", calls: 1}, {note: "+0", calls: 1}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  th: {waveform: "pulse", adsr: [0, 9, 4, 5], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+11", calls: 1}, {note: "+6", calls: 1}, {note: "+4", calls: 1}, {note: "+0", calls: 1}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  sn9: {waveform: "pulse", adsr: [0, 9, 4, 5], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+15", calls: 1}, {note: "+11", calls: 1}, {note: "+6", calls: 1}, {note: "+0", calls: 1}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  hd: {waveform: "pulse", adsr: [0, 9, 4, 5], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+10", calls: 1}, {note: "+6", calls: 1}, {note: "+3", calls: 1}, {note: "+0", calls: 1}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  dm: {waveform: "pulse", adsr: [0, 9, 4, 5], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+9", calls: 1}, {note: "+6", calls: 1}, {note: "+3", calls: 1}, {note: "+0", calls: 1}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  qd: {waveform: "pulse", adsr: [0, 9, 4, 5], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+14", calls: 1}, {note: "+10", calls: 1}, {note: "+5", calls: 1}, {note: "+0", calls: 1}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  # Solo comping: one video frame per tone, the warbling game chord, and a narrower pulse.
  maw:
    waveform: "pulse"
    adsr: [0, 8, 5, 4]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+11"}, {note: "+7"}, {note: "+4"}, {note: "+0"}]
    pulsetable: {loop: 1, steps: [{set: 0.14}, {add: 20, frames: 24}, {add: -20, frames: 24}]}
    loop: 1
  miw: {waveform: "pulse", adsr: [0, 8, 5, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+10"}, {note: "+7"}, {note: "+3"}, {note: "+0"}], pulsetable: {loop: 1, steps: [{set: 0.14}, {add: 20, frames: 24}, {add: -20, frames: 24}]}, loop: 1}
  thw: {waveform: "pulse", adsr: [0, 8, 5, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+11"}, {note: "+6"}, {note: "+4"}, {note: "+0"}], pulsetable: {loop: 1, steps: [{set: 0.14}, {add: 20, frames: 24}, {add: -20, frames: 24}]}, loop: 1}
  snw: {waveform: "pulse", adsr: [0, 8, 5, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+15"}, {note: "+11"}, {note: "+6"}, {note: "+0"}], pulsetable: {loop: 1, steps: [{set: 0.14}, {add: 20, frames: 24}, {add: -20, frames: 24}]}, loop: 1}
  hdw: {waveform: "pulse", adsr: [0, 8, 5, 4], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+24"}, {wave: "pulse", note: "+10"}, {note: "+6"}, {note: "+3"}, {note: "+0"}], pulsetable: {loop: 1, steps: [{set: 0.14}, {add: 20, frames: 24}, {add: -20, frames: 24}]}, loop: 1}
  # E13#11 for the last two bars: two calls per tone and a long release.
  ly: {waveform: "pulse", adsr: [0, 11, 7, 11], hard_restart: {frames: 0}, wavetable: [{wave: "tri", note: "+24"}, {wave: "pulse", note: "+14", calls: 2}, {note: "+10", calls: 2}, {note: "+6", calls: 2}, {note: "+0", calls: 2}], pulsetable: {loop: 1, steps: [{set: 0.25}, {add: 14, frames: 30}, {add: -14, frames: 30}]}, loop: 1}
  # Bridge tines: one tone per note, triangle strike then a slowly narrowing pulse.
  tn:
    waveform: "pulse"
    adsr: [0, 8, 3, 6]
    hard_restart: {frames: 0}
    wavetable: [{wave: "tri", note: "+24"}, {wave: "tri", frames: 2}, {wave: "pulse"}]
    pulsetable: [{set: 0.32}, {add: -10, frames: 40}]
  # --- voice 3 ---
  # Clav chop: 10 % pulse opening fast, a saw click, no sustain.
  cv:
    waveform: "pulse"
    adsr: [0, 5, 0, 2]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: [{set: 0.10}, {add: 50, frames: 6}]
  # Copper lead (head): saw click an octave up, pulse opening from 8 % to 31 % in 16 frames, then breathing
  # slowly; vibrato 0.4 semitone at 6.2 Hz that starts after 12 frames and grows over 16.
  cu:
    waveform: "pulse"
    adsr: [0, 7, 10, 5]
    hard_restart: {frames: 0}
    wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}]
    pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}
    vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}
  # Scoop: up from a minor third below in one-frame steps (a relative slide_to would make one instrument per pitch).
  scp: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "-3"}, {wave: "pulse", note: "-3"}, {note: "-2"}, {note: "-1"}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}}
  # Clean body for the explicitly scored minor-third scoop, with no chromatic staircase in the wavetable.
  scoop: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", frames: 1}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}}
  grc: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "-1", frames: 3}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}}
  mrd: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", frames: 3}, {note: "+2", frames: 3}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}}
  trl: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", note: "+0", frames: 3}, {note: "+2", frames: 3}], pulsetable: {loop: 1, steps: [{set: 0.2}, {add: 20, frames: 20}, {add: -20, frames: 20}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}, loop: 1}
  fall: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse", frames: 14}, {note: "-1"}, {note: "-2"}, {note: "-3"}, {note: "-5"}, {note: "-7", frames: 2}, {note: "-9", gate: false}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}}
  blue: {waveform: "pulse", adsr: [0, 7, 10, 5], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "-1"}, {wave: "pulse", note: "-1", frames: 9}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.4, rate: 6.2, delay: 12, fade: 16}}
  lend: {waveform: "pulse", adsr: [0, 7, 10, 10], hard_restart: {frames: 0}, wavetable: [{wave: "saw", note: "+12"}, {wave: "pulse"}], pulsetable: {loop: 2, steps: [{set: 0.08}, {add: 60, frames: 16}, {add: -12, frames: 50}, {add: 12, frames: 50}]}, vibrato: {depth: 0.5, rate: 5.8, delay: 30, fade: 40}}
  # Reed lead (solo): one noise frame two octaves up, two saw frames, then a wide pulse narrowing and
  # widening every 20 frames; deeper and faster vibrato that starts earlier and grows over 12 frames.
  rd:
    waveform: "pulse"
    adsr: [0, 5, 11, 4]
    hard_restart: {frames: 0}
    wavetable: [{wave: "noise", note: "+12"}, {wave: "saw", frames: 2}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 0.45}, {add: -40, frames: 20}, {add: 40, frames: 20}]}
    vibrato: {depth: 0.55, rate: 7, delay: 8, fade: 12}
  rscp: {waveform: "pulse", adsr: [0, 5, 11, 4], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "+12"}, {wave: "saw", note: "-2"}, {wave: "saw", note: "-1", frames: 2}, {wave: "pulse"}], pulsetable: {loop: 1, steps: [{set: 0.45}, {add: -40, frames: 20}, {add: 40, frames: 20}]}, vibrato: {depth: 0.55, rate: 7, delay: 8, fade: 12}}
  rfall: {waveform: "pulse", adsr: [0, 5, 11, 4], hard_restart: {frames: 0}, wavetable: [{wave: "noise", note: "+12"}, {wave: "saw", frames: 2}, {wave: "pulse", frames: 14}, {note: "-1"}, {note: "-3"}, {note: "-5"}, {note: "-7"}, {note: "-10"}, {note: "-12", gate: false}], pulsetable: {loop: 1, steps: [{set: 0.45}, {add: -40, frames: 20}, {add: 40, frames: 20}]}, vibrato: {depth: 0.55, rate: 7, delay: 8, fade: 12}}
  # Glass lead (bridge): noise breath, six triangle frames, then a square wave narrowing slowly; slow attack,
  # gentle late vibrato that swells over 30 frames.
  gl:
    waveform: "pulse"
    adsr: [2, 6, 11, 6]
    wavetable: [{wave: "noise", note: "+19"}, {wave: "tri", frames: 6}, {wave: "pulse"}]
    pulsetable: {loop: 1, steps: [{set: 0.5}, {add: -6, frames: 80}, {add: 6, frames: 80}]}
    vibrato: {depth: 0.3, rate: 5.6, delay: 20, fade: 30}
  gscp: {waveform: "pulse", adsr: [2, 6, 11, 6], wavetable: [{wave: "noise", note: "+19"}, {wave: "tri", note: "-2", frames: 3}, {wave: "tri", note: "-1", frames: 3}, {wave: "pulse"}], pulsetable: {loop: 1, steps: [{set: 0.5}, {add: -6, frames: 80}, {add: 6, frames: 80}]}, vibrato: {depth: 0.3, rate: 5.6, delay: 20, fade: 30}}
  gtrl: {waveform: "pulse", adsr: [2, 6, 11, 6], wavetable: [{wave: "noise", note: "+19"}, {wave: "tri", note: "+0", frames: 4}, {note: "+2", frames: 4}], pulsetable: {loop: 1, steps: [{set: 0.5}, {add: -6, frames: 80}, {add: 6, frames: 80}]}, vibrato: {depth: 0.3, rate: 5.6, delay: 20, fade: 30}, loop: 1}
  gfall: {waveform: "pulse", adsr: [2, 6, 11, 6], wavetable: [{wave: "noise", note: "+19"}, {wave: "tri", frames: 6}, {wave: "pulse", frames: 20}, {note: "-1", frames: 2}, {note: "-2", frames: 2}, {note: "-3", frames: 2}, {note: "-5", frames: 3}, {note: "-7", gate: false}], pulsetable: {loop: 1, steps: [{set: 0.5}, {add: -6, frames: 80}, {add: 6, frames: 80}]}, vibrato: {depth: 0.3, rate: 5.6, delay: 20, fade: 30}}
kit: {k: "kk", s: "sn", q: "sq", z: "sz", h: "hc", o: "ho", x: "hx"}
voices:
  - id: 1
    name: "Slap bass and kick/snare"
    role: "bass"
    instrument: "sl"
    patterns:
      in1: {groove: "E1 - E1@gh E2!@pp - E1@gh (D2 E2) A1 - A1@gh A2!@pp G2 E2@gh /G#2 A2", length: 0.25, bars: 1}
      in2: {groove: "C2 - C2@gh C3!@pp - G2@pp (B2 C3) B1 - B1@gh B2!@pp A2 F#2 D#2 /E2", length: 0.25, bars: 1}
      in3: {groove: "E1@hm E1@gh - E2!@pp (G2 A2) G2@pp E2@gh A1 A1@gh C#2 A2!@pp - E2 G2@pp /G#2", length: 0.25, bars: 1}
      in4: {groove: "C2 C3!@pp C2@gh G2@pp B1 C2@gh (D2 D#2) B1 - B2!@pp A2 F#2 D2@pp (D#2 E2)", length: 0.25, bars: 1}
      hb1: {groove: "k E2@gh E2 E3!@pp s z (D2 E2) k A1 A1@gh A2!@pp s G2 /G#2 A2", length: 0.25, bars: 1}
      hb2: {groove: "k C2 C2@gh C3!@pp s z (C2 B1) k B1@gh D#2 B2!@pp s A2 F#2 D#2", length: 0.25, bars: 1}
      hb3: {groove: "k z E2 E2@gh s (E2 G2) D2@gh k - A1 A2!@pp s E2@gh A2 F#2", length: 0.25, bars: 1}
      hb4: {groove: "k G1 G2@gh G2!@pp s D2 (F#2 G2) k C#2 C#3!@pp C#2@gh s F#1 F#2!@pp A#1", length: 0.25, bars: 1}
      hb5: {groove: "k B1 B1@gh B2!@pp s F#2 (A2 B2) k Bb1 Bb1@gh Bb2!@pp s Ab2 F2 /A1", length: 0.25, bars: 1}
