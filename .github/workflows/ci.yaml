name: Continuous Integration

on:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Docker changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Filter for Docker-related paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - 'Dockerfile'
              - 'apt-packages.txt'
              - '.github/workflows/docker-build.yaml'

  # Pull requests only build the image. The token of a pull request never receives packages: write,
  # because the image is later used as the build container of the release workflow.
  docker-image:
    name: Build Docker image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' && github.event_name != 'push' }}
    permissions:
      contents: read
    uses: ./.github/workflows/docker-build.yaml
    with:
      push: false

  docker-publish:
    name: Build and push Docker image
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.docker == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yaml
    with:
      push: true

  audit:
    name: Dependency audit and Node.js compatibility
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/mcp-builder:latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: npm ci
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Check packaged build under Node.js
        run: npm run check:node-compat

  build-and-test:
    name: Build and test
    needs:
      - detect-changes
      - docker-image
      - docker-publish
    if: ${{ always() && needs.detect-changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-and-test.yaml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  package-check:
    name: Package check
    needs:
      - detect-changes
      - docker-image
      - docker-publish
    if: ${{ always() && needs.detect-changes.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/package-check.yaml
    with:
      package_source: local
