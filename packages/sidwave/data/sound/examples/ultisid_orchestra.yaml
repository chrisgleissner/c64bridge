# An Atlas of Wind | orchestral rhapsody | 8 SIDs, 24 voices
# Techniques: Antiphonal woodwind and brass, voice-led string choir, harp and timpani; 94 BPM D-minor opening, a 3:2 cut into the brighter F-major crosswind, then a two-bar broadening into the changed D-minor reprise.
# Learn: The opening wind-call moves from flute to oboe, fragments through the reduced crosswind, then returns with a trumpet counterline and a new cadence. The crosswind is the sudden reduction and harmonic turn.
# Accepted lint: CLASH (28 short echo tails cross chord changes; the echo levels are 0.3 and remain subordinate).
#
# Form (64 bars, about 2:47): Dawn 8 (strings, harps, flute and oboe) / Wind 16 (theme, kit, horns, clarinet ostinato)
# / Crosswind 16 (true reduction in F major: no kick, no horns, flute-oboe dialogue over the strings) / Full map 16
# (theme on a brighter lead with a trumpet counter-line and the full kit) / Harbor 8 with a held D-minor chord.
# Left UltiSID (sid1-sid4): kit, contrabass and lead plus violins I, violas, horn 1, flute, clarinet, harp chords,
# bassoon, lead echo, celesta. Right UltiSID (sid5-sid8): unison copies of kit, contrabass, lead and violins I, then
# violins II, cellos, horn 2, oboe, cymbals, harp arpeggios, second lead echo and trumpet.
# Accepted lint: ONE-SIDE on v1-v3, which are centred by unison copies on sid5 (v13-v15); center: true needs an
# unscored mirror channel and all 24 channels are used. LEVEL-NOOP: library drums and the crash have sustain 0.
# Chip volumes are about 4-5 dB lower than before (library loudness balance, round 3 review).
# CLASH: only where an echo tail (sustain 2-3 of 15) crosses a chord change by up to a dotted quarter.
