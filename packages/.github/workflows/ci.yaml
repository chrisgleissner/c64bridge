name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: npm ci
      - run: npm run build
      - name: Tests on Node
        if: matrix.runtime == 'node'
        run: npm test
      - name: Tests on Bun
        if: matrix.runtime == 'bun'
        run: npm run test:bun

  coverage:
    name: Coverage gate (90 % lines per package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: npm ci
      - run: npm run coverage

  package:
    name: Pack and clean-install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1
      - run: npm ci
      - run: npm run build
      - name: Pack both packages, install them in an empty project, compile on Node and Bun
        run: npm run check:consumer
